# 15:54 scan - Jack's call, all at once. The world is the master copy; whatever a design
# still listed as remaining work is no longer wanted. The full inventory and final standing
# state of all 34 designs is recorded in CLAUDE.md ("All designs accepted as complete").
# The litematics, sidecars and configs stay untouched as records of what was designed.
#
# Both lists below are therefore EMPTY, deliberately:
