# One command after each /cscan:  python -m mcbuild sync
scan: island
cut: [-24251, 150, 29949, -24149, 270, 30051]
world_out: out/island_now.litematic
regen:                              # regenerated against the new scan (they key off ground state, so they self-heal)
  - configs/belly.yaml
  - configs/hem.yaml
  - configs/footings.yaml
  - configs/paths.yaml
  - configs/lightposts.yaml
  - configs/apiary.yaml
  - configs/entrance.yaml
progress:                           # designs reported (% built, left, shop list)
  - out/Island Belly Full.litematic
  - out/Taproot.litematic
  - out/Shed Shard.litematic
  - out/Chimneys.litematic
  - out/Statue Footings.litematic
  - out/Rim Hem.litematic
  - out/Path Network.litematic
  - out/Light Posts.litematic
  - out/Deck Entrance.litematic
  - out/Ride Lights.litematic
  - out/Apiary Flowers.litematic
  - out/Bird Lanterns.litematic
  - out/Deck Vault.litematic     # NOT in regen: `under` is pinned to the pre-vault capture (see configs/vault.yaml)
learn: true
