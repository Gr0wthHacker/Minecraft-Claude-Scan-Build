# One command after each /cscan:  python -m mcbuild sync
scan: island
cut: [-24251, 150, 29949, -24149, 270, 30051]
world_out: out/island_now.litematic
deep_out: out/island_deep.litematic   # Y130-200: below-island designs verify against this
deep_cut: [-24251, 130, 29949, -24149, 215, 30051]   # top must clear the plate: cutting at 200
                                                     # truncates vines whose anchor is above it

# PROGRESS is measured against THIS, not against the Y150 plate cut. Reporting a below-island
# design against `world_out` counts everything under Y150 as "outside the scan box" and calls
# it unbuilt - which is how every lowland design read 0% for that whole scene's life.
full_out: out/island_full.litematic

# ACCEPTED 2026-08-23: every tracked design was accepted as complete AS IT STANDS in the
# 15:54 scan - Jack's call, all at once. The world is the master copy; whatever a design
# still listed as remaining work is no longer wanted. The full inventory and final standing
# state of all 34 designs is recorded in CLAUDE.md ("All designs accepted as complete").
# The litematics, sidecars and configs stay untouched as records of what was designed.
#
# Both lists below are therefore EMPTY, deliberately:
#   regen: []     so the ground designs stop re-emitting remainders (and stop re-planting
#                 the vines Jack is purging by hand)
#   progress: []  so designs.json says "you track nothing" - the mod places/plans/follows
#                 nothing, which is correct for a finished island. An empty list is not a
#                 missing file: bare /cscan place still refuses the 61-design folder sweep.
#
# NEW projects get added to progress: (and regen: if they are remaining-work) as they are
# created, and tracking resumes for them alone.
regen: []

# NEW WORK since the acceptance. Both were designed against the 15:54 scan and both are
# tracked again, so `/cscan place`, `plan` and `follow` mean these two and nothing else.
# Build ORDER matters: the Falls' notch is the plug (dig it last), and the night pass was
# solved against a world with the Falls already cut.
# Build ORDER is the list order and it matters twice over: the Falls' notch is the plug (dig
# it last within that design), and the Thicket must be planted BEFORE the night pass because
# pointed dripstone is not passable and moves the surface classifier - the night solve was run
# against a world that already contains both.
progress:
  - out/Falls.litematic           # 30 blocks + 41 dig: the channel that lets the isle spill
  - out/Lowland Thicket.litematic # 1454 plants: the lush cave the lowland never had
  - out/Island Night.litematic    # 107 fixtures + 31 dig: zero spawnable surface cells
learn: true
