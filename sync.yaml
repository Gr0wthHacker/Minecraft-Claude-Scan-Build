# One command after each /cscan:  python -m mcbuild sync
scan: island
cut: [-24251, 150, 29949, -24149, 270, 30051]
world_out: out/island_now.litematic
deep_out: out/island_deep.litematic   # Y130-200: below-island designs verify against this
deep_cut: [-24251, 130, 29949, -24149, 215, 30051]   # top must clear the plate: cutting at 200
                                                     # truncates vines whose anchor is above it
regen:                              # regenerated against the new scan (they key off ground state, so they self-heal)
  - configs/belly.yaml
  - configs/hem.yaml
  - configs/footings.yaml
  - configs/paths.yaml
  - configs/lightposts.yaml
  - configs/apiary.yaml
  - configs/entrance.yaml
progress:                           # designs reported (% built, left, shop list)
  - out/Island Belly Full.litematic
  - out/Taproot.litematic
  - out/Shed Shard.litematic
  - out/Chimneys.litematic
  - out/Statue Footings.litematic
  - out/Rim Hem.litematic
  - out/Path Network.litematic
  - out/Light Posts.litematic
  - out/Deck Entrance.litematic
  - out/Ride Lights.litematic
  - out/Apiary Flowers.litematic
  - out/Bird Lanterns.litematic
  - out/Deck Vault.litematic     # NOT in regen: `under` is pinned to the pre-vault capture (see configs/vault.yaml)
  # RETIRED 2026-08-20. Sky Well Court was the moss-and-pond scheme for this space; the deepslate
  # Court Hall replaced it. Measured against the 12:33 capture it has 162 cells holding a DIFFERENT
  # block - 168 of its conflicts fall inside the hall - because it wants moss carpet, glow lichen and
  # water where the hall's floor, pilasters and basin now are. Its only surviving content is ~27
  # lichen/dripstone cells outside the hall footprint. Retired, not deleted: the litematic stays so
  # the derivation is on record, exactly as the jaguar and the bear were retired from the lowland.
  # - out/Sky Well Court.litematic
  - out/Court Hall.litematic
  - out/Court Stair.litematic
  - out/Store Hall.litematic
  - out/Undercroft Store.litematic
  - out/Entry Hall.litematic
  - out/Atelier Court.litematic  # below-island origin -24251 130 29949
  - out/Void Giraffe.litematic   # Y99-150, its own origin
  - out/Void Isle.litematic      # Y86-108, its own origin (origin_lock: false)
  - out/Shop Islet.litematic     # below-island: its own locked origin -24251 130 29949
  - out/Root Stair.litematic     # same origin as the islet
  # the lowland scene (2026-08-21): the ruined ring-gate in the SE skylight and the axolotl on
  # the pond's north bank. The ground and the other animals are placed by name, not tracked -
  # but these two are NEW work the loop should know about. The heron is RETIRED (see
  # configs/lowland_heron.yaml): one of heron/capybara had to go, and the flamingo already
  # holds the wading-bird slot.
  - out/Lowland Portal.litematic
  - out/Lowland Axolotl.litematic   # AS BUILT: re-derived from the world after Jack placed it
                                    # on the WEST bank rotated 180 - see configs/lowland_axolotl.yaml
  - out/Lowland Ruinway.litematic   # the blackstone way and its fragments (2026-08-21)
  - out/Lowland Sanctum.litematic   # the quarter's one complete building, in the north skylight
  - out/Castle Bridge.litematic     # broken span, island SE rim -> bat tower parapet, Y150-153
learn: true
