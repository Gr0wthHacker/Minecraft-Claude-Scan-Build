# A species, in the six things that actually distinguish it. Everything about its SHAPE comes from
# `families.yaml` x `height`, so nothing here needs tuning and nothing here can drift out of family.
#
#   family    the proportion table it inherits
#   height    total height in blocks. `python tools/scale.py <species>` gives the floor below which
#             the family's finest feature cannot be built at all.
#   build     the few generator settings that genuinely differ from the family
#   coat      palette and pattern - within a family this is most of what separates one species
#             from another, which is the whole reason the split is drawn here
#   features  anything beyond the family's own list
#
# Note how little each says. A lion and a leopard are the same animal in this system apart from a
# mane and a coat, which is very nearly true of the real ones.
#
# NEVER put an ABSOLUTE BLOCK COUNT in `build`. All three felids carried a hand-tuned `body_r`
# (3.6 / 3.0 / 3.8) left over from before proportions were derived, and because `build` overrides
# whatever `taxonomy.derive` computes, it silently won. They built 23-33% too narrow, and the error
# GREW with height - the jaguar's proportion score fell 0.75 -> 0.50 as it was scaled up, which is
# the signature of an absolute among ratios. Removing them took the jaguar 0.73 -> 0.805 on its own.
# `build` is for RATIOS (head_r_ratio) and switches (mane_volume, head_turn); anything measured in
# blocks belongs in the family's proportion table, where height scales it.

# ---------------------------------------------------------------- felids
jaguar:
  family: felid
  height: 27
  build: {ring_radius: 0.60, ring_thickness: 0.34, ring_broken: 0.34}
  coat:
    coat_pattern: rosettes
    patch_scale: 4.6
    coat_block: stripped_oak_wood        # golden tan
    patch: black_wool                    # near-black rings; brown-on-brown reads as noise
    patch_alt: stripped_jungle_log
    belly_block: bone_block
    belly_frac: 0.20
    muzzle: bone_block
    dark: black_wool
    hoof_block: dark_oak_wood
  features: [rosettes, pale_belly]

leopard:
  family: felid
  height: 26                             # lighter and smaller than a jaguar (27); same animal
                                         # otherwise. It was 22, which is UNDER the felid floor of
                                         # 23 - the rosettes had no room and `surface` scored 0.27.
  build: {ring_radius: 0.52, ring_thickness: 0.30, ring_broken: 0.40}
  coat:
    coat_pattern: rosettes
    patch_scale: 3.6                     # smaller, denser rosettes than a jaguar's
    coat_block: stripped_oak_log
    patch: black_wool
    patch_alt: stripped_jungle_log
    belly_block: bone_block
    belly_frac: 0.22
    muzzle: bone_block
    dark: black_wool
    hoof_block: dark_oak_wood
  features: [rosettes, pale_belly]

lion:
  family: felid
  height: 32
  # the mane is the whole difference, so it has to be BOTH a silhouette break and a tonal one.
  # `mane_volume` is how many blocks it stands PROUD of the barrel - not its radius.
  build: {mane_volume: 3.0, head_r_ratio: 0.46}
  coat:
    coat_pattern: shaded
    coat_ramp: [spruce_planks, coarse_dirt, dirt, oak_log, stripped_oak_log]
    shade_strength: 1.1
    coat_block: oak_log
    patch: oak_log
    patch_alt: stripped_oak_log
    # measured, not guessed: oak_log is (151,122,73) and mangrove_wood is (84,67,41), a 45% drop
    # in luminance. dark_oak_wood (60,47,26) was too dark - it read as a hole, not as hair.
    mane_block: mangrove_wood
    muzzle: bone_block
    dark: black_wool
    hoof_block: dark_oak_wood
  features: [mane]

# ---------------------------------------------------------------- ursids
bear:
  family: ursid
  height: 30
  build: {head_turn: 1}
  coat:
    coat_pattern: shaded
    coat_ramp: [dark_oak_planks, stripped_dark_oak_wood, mangrove_wood, spruce_planks, coarse_dirt]
    shade_strength: 1.1
    coat_block: mangrove_wood
    patch: mangrove_wood
    patch_alt: stripped_dark_oak_wood
    muzzle: oak_log
    dark: black_wool
    hoof_block: black_wool

polar_bear:
  family: ursid
  height: 32                             # the largest bear, so TALLER than the brown bear at 30.
                                         # It was 26 - which is the ursid floor exactly, every
                                         # feature at its minimum and none with any structure. The
                                         # silhouette test called it a CAVIOMORPH at that size,
                                         # because a skull with no room to be broad is a rodent's.
  # A narrower, longer skull than the brown bear's - the ursid table's 0.55 is the broad, dished
  # brown-bear face, and a polar bear's is the family's most tapered. This is the only SHAPE
  # difference between the two, and it is worth 0.134 -> 0.155 on the built-model gap.
  #
  # `hump: 0.20` on the brown bear was the obvious other half of this and was MEASURED AND REJECTED:
  # a shoulder hump is the real field mark, but building one lifts the back over the withers, and
  # `withers height` is a measured proportion - the bear fell from 6/8 in tolerance to 4/8, lost
  # 0.06 overall, and the gap to the polar bear SHRANK to 0.104. The reference tables state withers
  # without a hump, so a hump cannot be built until they state it with one.
  build: {head_turn: 1, head_r_ratio: 0.40}
  coat:
    coat_pattern: shaded
    # a NARROW ramp. Spanning tan to white made the shading paint the back snow and the
    # legs oak, so it read as two different animals joined together.
    coat_ramp: [bone_block, bone_block, birch_wood, white_wool, snow_block]
    shade_strength: 1.2                  # a white animal lives or dies on its shading
    coat_block: bone_block
    patch: bone_block
    patch_alt: birch_wood
    muzzle: black_wool
    dark: black_wool
    hoof_block: black_wool

# ---------------------------------------------------------------- others
elephant:
  family: proboscid
  height: 34
  build: {head_turn: 1}
  coat:
    coat_pattern: shaded
    coat_ramp: [deepslate, tuff, stone, andesite, smooth_stone]
    shade_strength: 1.15
    coat_block: stone
    patch: stone
    patch_alt: andesite
    muzzle: tuff
    dark: black_wool
    hoof_block: andesite

capybara:
  family: caviomorph
  height: 25                             # `tools/scale.py` puts the caviomorph floor at 23, bound by
                                         # neck length; at 21 the neck fell below three blocks and the
                                         # rubric's legibility gate refused it outright
  build: {head_turn: 1}
  coat:
    coat_pattern: shaded
    coat_ramp: [spruce_planks, coarse_dirt, dirt, jungle_log, stripped_jungle_log]
    shade_strength: 1.1
    coat_block: jungle_log
    patch: jungle_log
    patch_alt: stripped_jungle_log
    muzzle: stripped_jungle_log
    dark: black_wool
    hoof_block: black_wool

giraffe:
  family: giraffid
  height: 57
  build: {head_turn: 1}
  coat:
    coat_pattern: voronoi
    patch_scale: 5.5
    grout: 0.85
    coat_block: bone_block               # sandstone does not exist on this skyblock
    patch: acacia_planks
    patch_alt: stripped_acacia_log
    muzzle: white_wool
    dark: black_wool
    hoof_block: dark_oak_wood
  features: [patches]
