# Real-animal proportions, as fractions of TOTAL HEIGHT - the only measure that survives a change of
# scale. `tools/proportions.py` checks a built statue against these.
#
# Add a species here and its statue can be audited; the shape itself is a PROFILE in gen/quadruped.py.
# The two are separate on purpose: the profile says what to build, this says what right looks like.
#
# The WIDTH figures are the ones voxel builds get wrong, because thickening a shape makes every
# smoothness metric happier. They have to be checked or the animal inflates one tuning run at a time.

giraffe:
  total_m: 5.5
  withers height: 3.2      # the shoulder - what makes it look like it stands on stilts
  leg (ground->belly): 1.9
  body depth: 1.3          # belly to withers
  body length: 2.3         # chest to rump
  body width: 0.9          # NARROW: a giraffe is deep and slab-sided, not a barrel
  neck length: 2.2
  head length: 0.65
  leg width: 0.28
  # How much of its life the species spends in each stance. 0 means do not build it: a giraffe going
  # down is not a stylistic choice, it is a sick or calving animal. They sleep standing.
  poses: {standing: 1.00, grazing: 0.80, couchant: 0.12, sitting: 0.02, prowling: 0.00}

horse:
  # total is HEAD-UP height, not the withers figure usually quoted for horses - the statue is measured
  # from hoof to the top of the head, so the reference has to be too.
  total_m: 2.40
  withers height: 1.55
  leg (ground->belly): 0.95
  body depth: 0.60
  body length: 1.60
  body width: 0.45
  neck length: 0.70
  head length: 0.60
  leg width: 0.14
  poses: {standing: 1.00, grazing: 0.85, couchant: 0.25, sitting: 0.00, prowling: 0.00}

deer:
  total_m: 1.50            # head-up, as above
  withers height: 1.05
  leg (ground->belly): 0.62
  body depth: 0.43
  body length: 1.10
  body width: 0.28
  neck length: 0.35
  head length: 0.32
  leg width: 0.08
  poses: {standing: 0.95, grazing: 0.90, couchant: 0.60, sitting: 0.05, prowling: 0.10}

jaguar:
  # Head-up total height. A jaguar is LONGER THAN IT IS TALL - body length exceeds total height,
  # which no other animal in this table does, and it is the measure that most defines the species.
  total_m: 0.85
  withers height: 0.72
  leg (ground->belly): 0.40
  body depth: 0.32
  body length: 0.95
  body width: 0.30
  neck length: 0.18
  head length: 0.28
  leg width: 0.11
  # A cat is the mirror image of a giraffe here: it spends most of its life NOT standing, so a
  # standing jaguar is the odd one out and the resting poses are the honest choices.
  poses: {standing: 0.55, couchant: 1.00, sitting: 0.85, prowling: 0.95, grazing: 0.10}
