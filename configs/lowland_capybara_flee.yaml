# RETIRED (2026-08-22). Jack's call, same day as the flamingo: the lowland goes to architecture,
# with animals incorporated around the buildings rather than standing as the figures. Never built
# (0 of 6,813 cells in the 15:01 Aug 22 scan) across three days while the whole ruins quarter went
# up around it, so nothing is orphaned. Retiring it frees the central strip (X-24196..-24179 /
# Z29984..30042) - including the skylight-south pad the Lowland Hamlet now stands on - and releases
# the z30019-21 walk-under corridor constraint on the way. Kept as a record, not regenerated.
#
# THE QUARRY, RUNNING.
#
# Breaking away south while the jaguar comes down out of the west. It runs ACROSS the cat's line
# rather than along it, which is what prey actually does - a straight sprint away from a predator
# already in the air is a losing race - and it is also the only thing the ground allows: a capybara
# is 50 blocks deep because its head projects 31 past its feet, the diving cat takes 45 of the
# lowland's 99, and the two will not fit nose to tail on one axis.
#
# `running` throws the whole animal
# forward - the barrel tips nose-down, the neck comes out low and long ahead of the shoulder - and
# `leg_phase: 4` advances one leg of each diagonal pair, which is the gait a quadruped actually runs
# in. Without the phase the legs stand in a row and the statue is of an animal standing still.
#
# It costs about 25 points of symmetry, which the rubric allows for because the asymmetry is
# RECORDED in the sidecar. That is the whole reason `leg_phase` is a build parameter rather than
# something done by hand afterwards.
name: Lowland Capybara Flee
gen: quadruped
params:
  profile: capybara
  pose: running
  scale: 1.0
  leg_phase: 4
  under: out/lowland_planned.litematic
  feet: [-24185, 41, 30005]  # ground here is Y39 on the 2026-08-21 scan (was 36 when first
                             # sited) and ROLLS to 43 under the 54-block body - at 40 the low
                             # cells sat level with the risen massif's top course, 9 overlaps.
                             # 41 clears every rise, and a mid-gallop animal with a foot or two
                             # airborne is the pose being asked for, not a floating statue.
  look_at: [-24185, 37, 30060]     # BREAKING SOUTH, across the cat's line rather than along it
origin_lock: false
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  trim_buried: true    # the massif rolls under this animal; cells inside a ground rise yield to it
  context_clear: [vine, short_grass, fern, moss_carpet, poppy, dandelion, azalea, flowering_azalea]
  verify_against: out/lowland_planned.litematic
