# THE ISLAND RUN - a parkour descent that winds around the island (2026-08-23).
#
# THE FIRST VERSION WAS A STAIRCASE AND JACK SAID SO: 3x3 landings four blocks apart with a
# two-course drop every time - no failure mode, no variety, no jump pads. A ramp with gaps in
# it is not parkour. This one has a vocabulary and a rhythm, and it gets harder as it goes:
#
#   LEDGE   a ONE-BLOCK landing, 3 to 4.5 out and nearly level - the sprint jump is the game
#   PLUNGE  a real 8-16 course fall onto a SLIME pad, which bounces and cancels the damage.
#           This is the jump pad, and it is what buys the height so the ledges can stay level.
#   GATE    a wall on the landing, so the jump clears something as well as reaching it
#   REST    a 3x3 lit checkpoint - the only place the run lets go of you
#
# And the boundary is real now: `mcbuild.plot` finds the island's BEDROCK at (-24200,200,30000)
# and measures 49 out on each axis. The first build guarded against the CAPTURE box, which is
# two blocks wider on every side, and shipped 120 cells off the edge of the plot.
#
# Jack's idea: jump pads from the top that wind all the way around, all the way down. The
# PHYSICS settled its shape before the design did. Steering a fall buys you about 2.0 blocks
# of horizontal reach for a 2-course drop, 5.0 for a 13-course drop, 7.7 for a 30-course one.
# One turn of this island at r=52 is 320 blocks of travel and there are 157 courses between
# the plate rim and the lowland floor. So:
#
#   a FALLING course on slime pads winds about a QUARTER of a turn before it runs out of
#     island - it cannot do what was asked
#   a JUMPING course of 2-course drops needs ~80 hops for a full turn and spends 160 courses
#
# 157 available against 160 needed is as close to an exact fit as this sort of thing gets, and
# it is why the run is a jump course. It also means NO SLIME anywhere: a two-course drop does
# no damage, so a bounce pad would solve a problem the geometry already removed.
#
# THE ROUTE IS SEARCHED, NOT DRAWN - each hop finds a site within jumping reach that is clear
# of the world, of every design, and has headroom. That is what threads it past the giraffe,
# the ladybird, the bat and the shop islet, which all stand out to r 57-65 in this band.
#
# EVERY PAD CARRIES ITS OWN LIGHT. A pad is a new walkable surface in the void, so unlit it is
# 77 new places for a mob to stand; and a lit ring winding once around the island is what this
# is for after dark. The stone follows the island's own gradient - island rock, then deepslate,
# then the quarter's blackstone - the same one the Lowland Stair carries.
name: Island Run
gen: parkour
params:
  under: out/island_full.litematic
  y_top: 194
  y_bottom: 44
  radius: 43            # the PLOT clamps this: bedrock +/- 49, found not typed
  seed: 3

  # never site into LIVE work, built or not - the run threads a void that several
  # designs still have unplaced cells in
  reserve:
    - out/Castle Bridge.work.json
    - out/Falls.work.json
    - out/Island Belly Full.work.json
    - out/Island Enrichment.work.json
    - out/Island Night.work.json
    - out/Lowland Bat.work.json
    - out/Lowland Portal.work.json
    - out/Lowland Root.work.json
    - out/Lowland Stair.work.json
    - out/Lowland Thicket.work.json
    - out/Lowland.work.json
    - out/Shop Islet.work.json
    - out/Void Isle.work.json

# THE ONE EXPENSIVE THING, declared rather than smuggled. Slime is `expensive` on this
# economy and the run needs 13 blocks of it - because slime IS the jump pad, and no cheap
# block cancels a fall the way it does (hay only cuts damage by 80%, honey by 20%). 13 blocks
# is 117 slimeballs against the 193 in store, so it is affordable; it is stated here because
# every other design on this island is cheap-tier and this one is not.
expensive_allowance: 13

origin_lock: [-24251, 20, 29949]

finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false      # the whole design floats: that is the point of a parkour run
  verify_against: [out/island_full.litematic]
