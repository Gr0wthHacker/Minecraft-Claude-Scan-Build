# A sheared-off chunk of the island hanging under the taproot's foot, with a trading post on it.
#
# The taproot (configs/taproot.yaml) ends at a single cell, -24200 152 30018, and currently dangles
# into nothing. This is what it arrives at. Build the two together or neither makes sense.
#
# Site checked against the capture: the 25x17x25 box at Y138-154 was 0/10625 occupied.
# CARVED FOR THE WELL (2026-08-22): the Lowland Stair now screws straight down the taproot's
# axis through this islet's floor - Jack's alignment call - and 287 cells of this design's
# lens fill were removed where the stair's treads and headroom pass (the carve is re-derived
# from the stair's work.json envelope; regenerating this design re-fills the well and must be
# followed by re-carving). The shop's barrels, signs and their floor are untouched - the
# stair's dig rules cannot take them. One more cell went the same way (2026-08-22, the
# careful audit): the underside fill claimed (-24200,141,30018), the exact cell the
# Reaching Root hangs from, and deferring it left the root's 180 cells with nothing to
# place against. The root wins its anchor.
name: Shop Islet
gen: islet
params:
  under: out/island_deep.litematic   # island_now is cut at Y150; below-island work needs deeper
  center: [-24200, 30018]
  top_y: 150                # taproot foot is Y152, so the shelf sits 2 below it
  shop_offset: [3, 3]       # swept against the stair: [0,3] put an awning post inside a tread
  spike: [-24200, 30018]    # raised one course to Y151 to meet the root
  rx: 12.0                  # was 8/7. Enlarging is purely additive - the 763 cells already built
  rz: 11.0                  # stay valid - and there is a step change here: the raft finally
                            # reaches past the stair's shadow, so usable court floor goes
                            # 42 -> 190 cells. Cost per extra court cell also IMPROVES,
                            # 28 blocks at rx10 down to 7.2 at rx12.
  depth: 9
  wobble: 2.2
  moss: 0.55
  grass: 0.10
  carpet: 0.18
  vine_rate: 0.16
  vine_len: [2, 7]
  shop: true
  counter_len: 5
  labels: [stone, wood, food, moss, tools]
  lanterns: 4
  seed: 0
# LOUD NOTE, per rule 1: this design does NOT use the global origin_lock. The islet hangs at Y138-153,
# below the shared lock corner of Y150, and lowering that corner would repad and MOVE every existing
# design. So below-island work gets its own fixed corner instead - still locked, still unmovable by
# regeneration, just a second origin you have to place at. Anything else built down here must reuse it.
origin_lock: [-24251, 130, 29949]
finish:
  cheapen: true
  hollow: false
  ground: false             # it hangs in the void; there is no ground under it
  drop_floaters: false
  context_clear: [vine]     # any cut truncates vine strands at its top edge, and the orphans are
                            # the box's fault, not this design's
  verify_against: [out/island_deep.litematic, out/island_now.litematic]
