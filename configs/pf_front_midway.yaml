# PF FRONT MIDWAY - the grammar that turns the Midway's buildings into attractions.
#
# Two jobs here that the other two lands do not have:
#
# THE PARK'S BIGGEST MEASURED HOLE IS IN THIS LAND. Built columns per 20-wide U band across the
# public floor run near 2,000 next to troughs near 250, and that alternation IS what reads as
# "clusters then empty space". U320-339 is one of the four worst - 295 built columns against
# 1,581 free - and it is 22 x 69 of unbroken lawn immediately east of the Carousel, in full view
# from the spine. It gets the two largest things in this design.
#
# AND IT HOUSES THE HOMELESS SET PIECE. `out/park_final/artifacts/Sky Lift Sloth.litematic` is
# 5,300 blocks - a brown-wool sloth slung under a 46 x 22 spruce lattice - which used to hang
# from the Sky Lift's arch. The Sky Lift is now the wheel alone, so the best-reading kind of
# object this repo has measured (*a body slung UNDER a line*) has had nowhere to be. The arbour
# below is its home: eight masonry-and-timber piers carrying the lattice it already owns, with
# the sloth six courses up and seven clear courses to walk under it.
#
# THE SITES ARE MEASURED. Every `at` was placed against a free-lawn mask built from the shipped
# `Park Ways` and `Park Complete`; a cell is available only where the ground layer paved nothing,
# put no lamp or bench, and no module stands.
name: PF Front Midway
gen: park_frontage
params:
  land: midway
  anchor: [97500, 203, 80300]
  seed: 42
  pieces:
    # ---------------------------------------------------------------- marquees, on the spurs
    # A SPAN OF 7 RATHER THAN 5, HERE AND ON THE CAROUSEL, IS ARITHMETIC AND NOT TASTE. `Park
    # Ways` puts a lamp mast every 22 cells along the verge lamp line, and at span 5 the Midway's
    # piers land on the masts at U238 and U298. The opening may cross a mast - it is empty air and
    # the head beam clears it by two courses - but a PIER may not.
    # THE TITLE WAS WRONG AND IT NAMED A DIFFERENT LOT. This gantry stands on column A's own spur
    # at U235; the Welcome Court is at U280-320, forty-five blocks away and behind the entry gate.
    # A sign that names the building fifty blocks further on is worse than no sign.
    # AND THE BUILDING BEHIND IT CHANGED (2026-09-03). The Arrival Court was retired - `PF Entry
    # Gate` had already taken its job - and the Carousel moved out of column B into this lot at
    # diameter 39. The gantry does not move: the spur is still U234-236 and the carousel's own
    # forecourt is U231-239 behind it, so it fronts the ride exactly as it fronted the hall.
    - kind: marquee
      name: Carousel Court
      at: [20, 235]
      span: 7
      height: 7
      board: 3
      title: THE CAROUSEL
      lines: ["walk-on ride", "no queue"]
    # ---------------------------------------------------------------- THE CIRCUS GATE, REMOVED
    # Jack, on the placed park: *"gates and a board etc are all overlapping and chaotic with the
    # entrance to the main center."* Measured, he is describing three monumental things inside
    # twenty-four courses of one another, all announcing the same land:
    #
    #   V13-18   PF Entry Gate      a 61-wide gate building, towers, a portico, title THE MIDWAY
    #   V20-22   Circus Gate        a 41-wide gantry, fifteen courses, title MIDWAY CIRCUS
    #   V24-74   the Welcome Court  the walk-up itself
    #
    # ONE CELL OF LAWN separated the gate's back face from this gantry's piers and one more
    # separated the gantry from the court. It was sited when the entry gate's lot was six courses
    # deep and the axis was open ground; the gate grew to nineteen and this was never re-measured.
    #
    # It is REMOVED rather than moved. A visitor has just walked through a gate that names the
    # land, and the next thing they should meet is the vista down the walk to the wheel - which is
    # what this stood in. The Welcome Court carries the naming on its own threshold piers, at the
    # side of the walk rather than across it.
    - kind: marquee
      name: Skill Arcade
      at: [20, 362]
      span: 5
      title: SKILL ARCADE
      lines: ["five games", "prizes east"]
    # THESE TWO FRONT ONTO A CROSS WALK, and the ground layer gives each a spur exactly ONE
    # course deep between the walk and the door. So they are gantries like the rest and not
    # boards - a board here would stand ON its own spur, which is the whole failure this design
    # exists to avoid - and the piers are three wide because that one course is all the depth
    # there is to give the thing mass.
    - kind: marquee
      name: Snack Window
      at: [76, 235]
      span: 7
      pier: 3
      depth: 1
      title: SNACK WINDOW
      lines: ["food and drink", "seats behind"]
    # A GANTRY STRADDLES THE SPUR, NOT THE BUILDING. The Prize Point's own centre is U364 and
    # aiming the marquee there put a three-wide pier flat across the walk at U361-362, which
    # `test_nothing_stands_in_a_walkway` caught: measured off `Park Ways`, V79 is lawn the whole
    # way along except U361-363, and those three cells ARE the spur to the door. The board is
    # centred on them, so the opening is the walk and both piers stand on grass.
    - kind: marquee
      name: Prize Point
      at: [79, 362]
      span: 3
      pier: 3
      depth: 1
      title: PRIZE POINT
      lines: ["redeem tickets", "arcade prizes"]

    # ---------------------------------------------------------------- the Sky Lift's approach
    # THE WHEEL IS THE ONE MIDWAY RIDE THAT GENUINELY QUEUES - it loads a car at a time - so it
    # is the one that gets a line. The Carousel is a walk-on and gets thresholds instead, which is
    # a real distinction a visitor can read from the shape of what is in front of them.
    # RE-AIMED. The wheel moved from V92 to V80 when column B was re-ordered to put it on the
    # entrance axis as the park's centre attraction, and a marquee left at V74 stood 63 cells
    # inside it. A marquee belongs one course in front of the door it names.
    - kind: marquee
      name: Sky Lift
      at: [78, 274]
      span: 3
      depth: 2
      title: THE SKY LIFT
      lines: ["big wheel", "queue behind"]
    - kind: queue
      name: Sky Lift queue
      at: [68, 270]
      width: 9
      depth: 10
      # TWO COURSES BETWEEN RAILS, NOT THREE. There are sixteen courses of lawn between the
      # Carousel's back and the wheel's face and the exit portal has to land clear of both, so the
      # line is short - and at a rail every three it folds only twice, which is a corridor with a
      # kink in it rather than a queue.
      leg_every: 2
      title: WHEEL LINE
      lines: ["one car at a", "time - please", "wait here"]

    # ---------------------------------------------------------------- walk-on thresholds
    # THE CAROUSEL IS IN COLUMN A NOW, at V24-69 x U215-255 - the lot the Arrival Court held. Its
    # thresholds follow it, and they take the Skill Arcade's own arrangement because it is the same
    # problem: a lot whose door is a 3-wide spur with a gantry already over it. Marquee on the spur
    # at V20, portals at V21 flanking it - U227 and U243, eight either side of the lot's centre, so
    # a 5-wide frame clears the gantry's piers at U231/U239 and the verge lamp masts at U216/U238.
    - kind: portal
      name: Carousel entrance
      at: [21, 227]
      mode: entrance
      title: RIDE ENTRANCE
      lines: ["carousel", "", "step up"]
    - kind: portal
      name: Carousel exit
      at: [21, 243]
      mode: exit
      title: RIDE EXIT
      lines: ["", "", "mind the step"]
    - kind: portal
      name: Skill Arcade entrance
      at: [21, 354]
      mode: entrance
      title: GAMES IN HERE
      lines: ["five games", "", "prizes east"]
    - kind: portal
      name: Skill Arcade exit
      at: [21, 374]
      mode: exit
      title: WAY OUT
      lines: ["", "", "to the spine"]

    # ---------------------------------------------------------------- the Sloth garden, REMOVED
    # Jack: "I also think the sloth should be placed 'above' the railway somewhere, it can attach
    # to a part of the railway and be a part of the design, I think it takes up a lot of space on
    # the ground and it doesnt really need to be there."
    #
    # The arbour was 46 x 24 of Midway lawn plus eight two-by-two piers, and he is right that a
    # hanging animal has no business occupying ground. It is removed, and the sloth is homeless
    # again on purpose rather than left standing where it does not belong.
    #
    # WHAT MOUNTING IT ON THE VIADUCT ACTUALLY COSTS, measured, so nobody re-tries it blind:
    # the sloth is 46 deep x 30 tall x 24 wide and its lattice is the TOP three courses, with the
    # animal hung below. The rail corridor is V172-186, FIFTEEN columns, and the arcade under the
    # deck is eleven courses - so it fits neither across the corridor nor beneath the deck, and
    # rotated ninety degrees it is still 24 deep against 15. Hanging it BESIDE the viaduct works
    # geometrically (its lattice above the parapet, the animal at a rider's eye level) but needs
    # a bracket off the viaduct's own portal frames, which is a piece of `parkrail` work rather
    # than a frontage stamp - a lattice with no support is a floating component, which is what
    # the connectivity check would report and a render would not.
    # The former bandstand at V72/U316 was a third icon wedged between the carousel and wheel.
    # This band now stays empty so the two rides read as separate destinations.
    - kind: sight
      name: Arcade Bunting
      motif: bunting
      at: [24, 380]
      span: 3
      step: 8
      height: 6
roles: [construction]
design:
  purpose: path
  hierarchy: supporting
  style: midway
  narrative: >
    The Midway's frontage: name gantries over the Welcome Court, Carousel and Arcade spurs,
    boards on the two counters that front a cross walk, a queue for the wheel with its own
    entrance and way out, walk-on thresholds at the Carousel and Arcade, and a separate Sloth
    garden behind the Prize Point, away from the wheel's silhouette; bunting animates the arcade
    flank while the band between the carousel and wheel remains deliberately open.
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  verify_against: out/Park Complete.litematic
  verify_replaceable: [moss_carpet]
origin_lock: false
