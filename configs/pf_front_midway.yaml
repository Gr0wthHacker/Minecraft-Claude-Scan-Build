# PF FRONT MIDWAY - the grammar that turns the Midway's buildings into attractions.
#
# Two jobs here that the other two lands do not have:
#
# THE PARK'S BIGGEST MEASURED HOLE IS IN THIS LAND. Built columns per 20-wide U band across the
# public floor run near 2,000 next to troughs near 250, and that alternation IS what reads as
# "clusters then empty space". U320-339 is one of the four worst - 295 built columns against
# 1,581 free - and it is 22 x 69 of unbroken lawn immediately east of the Carousel, in full view
# from the spine. It gets the two largest things in this design.
#
# AND IT HOUSES THE HOMELESS SET PIECE. `out/park_final/artifacts/Sky Lift Sloth.litematic` is
# 5,300 blocks - a brown-wool sloth slung under a 46 x 22 spruce lattice - which used to hang
# from the Sky Lift's arch. The Sky Lift is now the wheel alone, so the best-reading kind of
# object this repo has measured (*a body slung UNDER a line*) has had nowhere to be. The arbour
# below is its home: eight masonry-and-timber piers carrying the lattice it already owns, with
# the sloth six courses up and seven clear courses to walk under it.
#
# THE SITES ARE MEASURED. Every `at` was placed against a free-lawn mask built from the shipped
# `Park Ways` and `Park Complete`; a cell is available only where the ground layer paved nothing,
# put no lamp or bench, and no module stands.
name: PF Front Midway
gen: park_frontage
params:
  land: midway
  anchor: [97500, 203, 80300]
  seed: 42
  pieces:
    # ---------------------------------------------------------------- marquees, on the spurs
    # A SPAN OF 7 RATHER THAN 5, HERE AND ON THE CAROUSEL, IS ARITHMETIC AND NOT TASTE. `Park
    # Ways` puts a lamp mast every 22 cells along the verge lamp line, and at span 5 the Midway's
    # piers land on the masts at U238 and U298. The opening may cross a mast - it is empty air and
    # the head beam clears it by two courses - but a PIER may not.
    - kind: marquee
      name: Arrival Court
      at: [20, 235]
      span: 7
      height: 7
      board: 3
      title: WELCOME COURT
      lines: ["the midway", "rides and games"]
    # ---------------------------------------------------------------- THE PARK'S CENTRAL ICON
    # U300 is the midpoint of a 600-block park and the Carousel's spur lands at U301, so this is
    # the one piece of ground on the axis every visitor walks that is also the middle of the
    # place. It is built as the grand one: three bays, seventeen cells of frontage, a ten-course
    # opening, a three-course fascia and a lit crown - fifteen courses in all.
    #
    # AND IT IS DELIBERATELY NOT A FOURTH SKYLINE DOMINANT. Measured above the lawn, the park's
    # three anchors are Prism Ascent 84, Sky Lift 74 and Mine Coaster 43, with the Carousel behind
    # this gate at 37. At 15 the gate reads as a threshold from either direction down the spine
    # and never competes with the things it is pointing at.
    #
    # WHY NOT THE MIDWAY CIRCUS. The roundabout at V125 U235 carrying the Aeronaut balloon is
    # measured out of the job rather than passed over: it stands 107 courses BEHIND the spine, 65
    # blocks off the park's own midpoint, and 26 courses tall - which puts it behind a 37-course
    # carousel and under a 74-course wheel from every public approach. It is a good terminal
    # ornament for the back promenade loop and it should stay exactly that.
    - kind: marquee
      name: Circus Gate
      at: [20, 301]
      span: 7
      wing: 1
      height: 10
      board: 3
      title: MIDWAY CIRCUS
      lines: ["carousel ahead", "wheel behind it"]
    - kind: marquee
      name: Skill Arcade
      at: [20, 362]
      span: 5
      title: SKILL ARCADE
      lines: ["five games", "prizes east"]
    # THESE TWO FRONT ONTO A CROSS WALK, and the ground layer gives each a spur exactly ONE
    # course deep between the walk and the door. So they are gantries like the rest and not
    # boards - a board here would stand ON its own spur, which is the whole failure this design
    # exists to avoid - and the piers are three wide because that one course is all the depth
    # there is to give the thing mass.
    - kind: marquee
      name: Snack Window
      at: [76, 235]
      span: 7
      pier: 3
      depth: 1
      title: SNACK WINDOW
      lines: ["food and drink", "seats behind"]
    - kind: marquee
      name: Prize Point
      at: [79, 362]
      span: 3
      pier: 3
      depth: 1
      title: PRIZE POINT
      lines: ["redeem tickets", "arcade prizes"]

    # ---------------------------------------------------------------- the Sky Lift's approach
    # THE WHEEL IS THE ONE MIDWAY RIDE THAT GENUINELY QUEUES - it loads a car at a time - so it
    # is the one that gets a line. The Carousel is a walk-on and gets thresholds instead, which is
    # a real distinction a visitor can read from the shape of what is in front of them.
    - kind: marquee
      name: Sky Lift
      at: [74, 300]
      span: 3
      depth: 2
      title: THE SKY LIFT
      lines: ["big wheel", "queue behind"]
    - kind: queue
      name: Sky Lift queue
      at: [79, 296]
      width: 9
      depth: 10
      # TWO COURSES BETWEEN RAILS, NOT THREE. There are sixteen courses of lawn between the
      # Carousel's back and the wheel's face and the exit portal has to land clear of both, so the
      # line is short - and at a rail every three it folds only twice, which is a corridor with a
      # kink in it rather than a queue.
      leg_every: 2
      title: WHEEL LINE
      lines: ["one car at a", "time - please", "wait here"]

    # ---------------------------------------------------------------- walk-on thresholds
    - kind: portal
      name: Carousel entrance
      at: [21, 291]
      mode: entrance
      title: RIDE ENTRANCE
      lines: ["carousel", "", "step up"]
    - kind: portal
      name: Carousel exit
      at: [21, 311]
      mode: exit
      title: RIDE EXIT
      lines: ["", "", "mind the step"]
    - kind: portal
      name: Skill Arcade entrance
      at: [21, 354]
      mode: entrance
      title: GAMES IN HERE
      lines: ["five games", "", "prizes east"]
    - kind: portal
      name: Skill Arcade exit
      at: [21, 374]
      mode: exit
      title: WAY OUT
      lines: ["", "", "to the spine"]

    # ---------------------------------------------------------------- the U320-339 trough
    # 22 x 69 OF UNBROKEN LAWN, the largest hole in the park, and everything below stands in it.
    # THE PIERS GO UNDER CELLS THAT EXIST: the lattice the sloth hangs from is a grid whose two
    # long rails run at its own U1-2 and U21-22, and everything between them is open air, so a
    # pier anywhere else would carry nothing and read as a post beside a sculpture.
    - kind: pergola
      name: Sloth Arbour piers
      at: [24, 312]
      size: [46, 24]
      top: 28
      pier_v: [0, 15, 30, 44]
      pier_u: [1, 21]
    - kind: stamp
      name: Sky Lift Sloth
      at: [24, 312]
      source: out/park_final/artifacts/Sky Lift Sloth.litematic
      lift: 6
    - kind: sight
      name: The Bandstand
      motif: bandstand
      at: [72, 316]
      radius: 4
      height: 6
      title: BANDSTAND
      lines: ["music at the", "top of the hour"]
    - kind: sight
      name: Arcade Bunting
      motif: bunting
      at: [24, 380]
      span: 3
      step: 8
      height: 6
roles: [construction]
design:
  purpose: path
  hierarchy: supporting
  style: midway
  narrative: >
    The Midway's frontage: name gantries over the Welcome Court, Carousel and Arcade spurs,
    boards on the two counters that front a cross walk, a queue for the wheel with its own
    entrance and way out, walk-on thresholds at the Carousel and Arcade, and - filling the
    largest measured hole in the park - a timber arbour carrying the homeless Sky Lift Sloth,
    a bandstand beside it and a bunting run down the arcade's flank.
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  verify_against: out/Park Complete.litematic
  verify_replaceable: [moss_carpet]
origin_lock: false
