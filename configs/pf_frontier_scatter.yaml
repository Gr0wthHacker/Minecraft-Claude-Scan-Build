# PF FRONTIER SCATTER - the land dressing. NOT ONE BUILDING in it, deliberately.
#
# Jack: "i dont want a bunch of buildings to go into, this is just a village then, thats opposite
# of what i asked for and is exactly what i complained on" ... "find other small things to add in
# the area either design or otherwise that complete it."
#
# ---------------------------------------------------------------------------------------------
# THE MEASUREMENT IS THE WHOLE ARGUMENT
#
# Counted over the shipped `out/Park Complete.litematic`, the Frontier's entire flora is:
#
#     moss_block 29,488 . moss_carpet 731 . mossy_cobblestone 439 . mossy_stone_bricks 2,356
#
# and **ZERO LEAVES**. Not one tree in a land that is 66% bare lawn. That is why 22,000 columns of
# it read as a green carpet with things standing on it - nothing GROWS there. A gold-rush frontier
# is pines, dead snags and rock, and the land had none of the three.
#
# ---------------------------------------------------------------------------------------------
# IT SWEEPS RATHER THAN PLANTING A LIST OF STANDS, AND THAT IS A MEASUREMENT TOO
#
# The open ground is 11,562 columns, of which only **1,542 survive a three-cell erosion**: the
# lawn is verges and gaps between buildings, and the largest free rectangle in the whole land is
# 8 x 18. A hand-picked list of stand centres found exactly ONE site that could hold a thicket.
# So the planting walks the land on a coarse lattice and plants wherever the ground itself allows,
# with a smooth density field so it comes out as thickets and clearings rather than as an even
# spread - which is the Lowland Thicket's rule (the randomness belongs on the drift, never on the
# cell) expressed as a sweep.
#
# **NOTHING GOES ON PAVING AND NOTHING NARROWS A WALK.** `Park Ways` owns every paved cell in the
# park. A candidate is planted only where the world's own ground course is moss AND every column
# within `path_clear` is moss too - because a pine one cell off a kerb is not dressing, it is a
# chicane.
name: PF Frontier Scatter
gen: frontier_scatter
params:
  kind: scatter
  lot: [200, 170]
  at: [0, 0]
  under: out/Park Complete.litematic
  # **EVERY MODULE'S LOT IS OFF LIMITS.** `OWN` lets a second run re-plant its own standing
  # trees - without it the run after the first refused almost everything and came out at 428
  # blocks against 3,843 - but the Diggings and the Mine Ridge are built from the SAME rock and
  # timber, so no material test can tell my pine from theirs. These are the land's lots, from
  # `tools/park_lots.PLACEMENT` and the two designs that carry their own origin.
  keep_out:
    - [24, 68, 0, 38]        # Trailhead Gate
    - [69, 119, 0, 39]       # Prospecting Porch
    - [130, 146, 0, 16]      # Vantage Frontier Lookout
    - [24, 76, 47, 92]       # Frontier Diggings
    - [80, 120, 47, 92]      # Mining Square
    - [130, 149, 47, 92]     # Assay and Prize Office
    - [24, 147, 99, 169]     # Mine Coaster and Mine Ridge
    - [148, 169, 6, 105]     # Mine Works
    - [157, 169, 125, 160]   # Works Yard
    # THE SAUROPOD'S GROUND. The land had no site for a 48-block animal anywhere but the outer rim
    # (see `configs/pf_sauropod.yaml` for the search), and the scatter had already planted 240
    # trees and props inside its footprint. A margin of two, because a canopy is cells.
    - [185, 199, 26, 81]       # PF Sauropod
    # **AND THE COASTER'S OWN FRONTAGE, WHICH IS ON THE VERGE AND NOT IN A LOT.** The verge
    # band V19-23 is legitimately this design's ground - it is between modules - so nothing
    # kept it off. Then the ride's entrance ensemble moved onto the station's real front at
    # U100-120 and a tipped-ore pile at V19-23/U117-121 landed inside the exit portal:
    # `park_place` reported 4 contested cells between the two. Land dressing yields to a
    # guest threshold. The band is the three pieces plus a cell of tolerance each end.
    - [19, 23, 97, 124]      # Mine Coaster frontage - entrance, marquee and exit
  # THE LAND IS THE LOST PLATEAU NOW, so the trees are. A broadleaf crown is wide and flat and
  # carried clear of the ground; `pine` narrows in steps and would be a fir in jungle colours.
  flora: jungle
  path_clear: 2
  # DENSER, BECAUSE THE GROUND IS SMALLER. With every module's lot off limits the plantable land
  # is the verges and the gaps between them, so the same density over a third of the area came out
  # at 1,881 blocks. The step and the density are set against what is actually available rather
  # than against the lot's nominal 200 x 170.
  sweep:
    step: 4
    density: 0.85
    # PINES DOMINATE, and the rest are what a worked hillside carries. Two entries of `pine`
    # against one each of the others is what makes a stand read as woodland rather than as a
    # sampler of four things.
    kinds: [jungle, jungle, jungle, snag, rock, debris]
  seed: 29
roles: [construction]
design:
  purpose: path
  hierarchy: filler
  style: frontier
  narrative: >
    The Frontier's planting and props: stands of spruce with stepped canopies on the open lawn,
    dead barkless snags, mossy boulders in the land's own quarried palette, and what a mine leaves
    lying about - cross-piled timber, tipped ore, a barrel on a cart axle.
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  verify_against: out/Park Complete.litematic
  verify_replaceable: [moss_carpet]
origin_lock: false
