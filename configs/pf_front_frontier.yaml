# PF FRONT FRONTIER - the grammar that turns the Frontier's buildings into attractions.
#
# Jack, on the placed park: "they are visually great - but all serve no actual defined purpose -
# it feels more like multiple villages or towns than a theme park or amusement destination."
#
# Nothing here is a building. Everything here is what stands IN FRONT OF and BETWEEN them: a name
# board over every attraction's own approach, a queue line at the ride, entrance and exit
# thresholds that read as thresholds, and sight pieces in the land's measured empty bands.
#
# THE SITES ARE MEASURED, NOT CHOSEN. Every `at` below was placed against a free-lawn mask built
# from the shipped `Park Ways` and `Park Complete`: a cell is available only if the ground layer
# paved nothing there, put no lamp or bench there, and no module stands there.
#   marquees   V20-22, the verge band, straddling the 3-wide SPUR the ground layer already lays
#              from the street to that attraction's front door - which is what an entrance arch
#              IS, and it costs no walkable ground: every cell over the paving is 5 courses up
#   queue      V26-63 x U160-167, the 9-wide strip of open lawn down the Mine Coaster's east
#              flank. 106 x 10 of nothing, on the largest lot in the park
#   sights     the same strip further back, and the empty U0-19 lawn under the Prospecting Porch
name: PF Front Frontier
gen: park_frontage
params:
  land: frontier
  anchor: [97500, 203, 80300]
  seed: 41
  pieces:
    # ---------------------------------------------------------------- marquees, on the spurs
    # THE PARK'S WESTERN THRESHOLD, so it is the land's grand one: a triple-bay gantry, seventeen
    # cells of frontage. It is the first thing anyone arriving down the spine reads.
    - kind: marquee
      name: Trailhead Gate
      at: [20, 19]
      span: 5
      wing: 1
      title: BASE CAMP GATE
      lines: ["lost plateau", "camp and dig"]
    # **RETITLED, BECAUSE THE PLACE IT NAMED IS GONE.** This read BOOMTOWN / "store - saloon /
    # telegraph" over the spur to `Boomtown Spine` - seven false-fronted shops, 0 interactive
    # blocks, retired. `PF Frontier Diggings` holds the lot now: a worked landscape with a trail,
    # a working yard, two shafts and two shops cut into its banks. A marquee naming a module
    # nobody placed is three references to somewhere a guest cannot go.
    - kind: marquee
      name: Frontier Diggings
      at: [20, 70]
      span: 7
      title: THE DIGGINGS
      lines: ["walk the trench", "store and shed"]
    - kind: marquee
      name: Mine Coaster
      # NO WING: A 24-WIDE GANTRY DOES NOT FIT A 21-WIDE FORECOURT. With `wing: 1` this piece is
      # four bays and its outer piers land 11 cells out either side - at U98-99, which is the U96
      # crossing's own walkway, and at U119-120, which is the platform's way out. One bay is 8
      # wide and sits inside the concourse with room for the exit gate beyond it.
      #
      # **IT STANDS ON THE DOOR'S OWN AXIS, AND A ROW OF V BOUGHT THAT.** At V20 the arch could
      # not reach U107 - the station's door - because V20/U105 is a CROSSING CORNER LAMP and the
      # arch's west pier lands on it. (A `keep_clear` band was tried and it left the U96 crossing
      # lit three-square, which `test_a_crossing_is_lit_four_square_or_not_at_all` caught.) Held
      # off the lamp the arch sat at U113, five cells east of the door: you walked under it and
      # the way in was over your shoulder.
      #
      # The lamp is at V20 ONLY. Standing the arch a course back at V21-23 clears it outright,
      # and V21-23 at U104-110 is open lawn - the U96 junction's apron paves V21 out to U103 and
      # stops. So the spur, the arch and the door are one line at U107, which is what an approach
      # to a ride is.
      at: [21, 107]
      # TWO COURSES DEEP, BECAUSE THE BACK SIGN LANDS AT `depth` AND V24 IS THE RIDE'S EAVE. At
      # depth 3 the arch reads its back sign at V24/h7, which is a cell of the station's own roof
      # overhang - `park_place` reported the clash between the two designs. At 2 the fascia is
      # V21-22 and the two signs fall on V20 and V23, both open lawn.
      depth: 2
      # SPAN 3, WHICH IS THE DEFAULT AND THE SPUR'S OWN WIDTH. At 5 the piers stand at U103-104
      # and U110-111, and V21/U103 is the last paved cell of the U96 junction's apron - a pier on
      # a walkway, which `test_nothing_stands_in_a_walkway` caught. At 3 they sit on lawn at
      # U104-105 and U109-110 and the opening is U106-108: the spur, the door and the arch.
      title: PLATEAU RUN
      lines: ["the big one", "queue east"]
    # THE POSTS AND THE PORCH HAVE NO SPUR, so there is no path to arch over and the same piece
    # is built solid and stands beside the door instead. `style: board`.
    - kind: marquee
      name: Prospecting Porch
      at: [70, 20]
      style: board
      width: 11
      depth: 2
      title: THE SCREENS
      lines: ["screen hut", "sorting run"]
    - kind: marquee
      name: Mining Square
      at: [80, 66]
      style: board
      width: 11
      depth: 1
      title: BASE CAMP
      lines: ["quarry run", "and ride exit"]
    - kind: marquee
      name: Assay and Prize Office
      at: [129, 62]
      style: board
      width: 11
      depth: 2
      title: THE FOSSIL LAB
      lines: ["log finds here", "claim prizes"]

    # ---------------------------------------------------------------- the ride's own thresholds
    # A SHOP DOOR IS A HOLE IN A WALL; A RIDE THRESHOLD IS A FRAME YOU PASS THROUGH WITH NOTHING
    # EITHER SIDE OF IT. Entrance and exit flank the coaster's approach so the two halves of a
    # ride are told apart before anybody reads a word - the entrance carries the land's accent
    # across its head and a lamp each side, the exit carries neither.
    #
    # **THEY STAND WHERE THE RIDE'S DOOR MEASURES, AND THE DECLARED ANCHORS WERE THE WRONG FILE.**
    # Jack: "the entrance to the rollercoaster and the queue stuff is all misaligned."
    #
    # `out/Mine Coaster.scan.json` declares guest anchors at U126/U134/U142/U146 and they were
    # taken at face value. **THAT SIDECAR BELONGS TO A BUILD THIS PARK DOES NOT PLACE.** There is
    # no `out/PF Mine Coaster.litematic`, so `tools/park_place.modules` falls through to
    # `out/park_final/artifacts/Mine Coaster.litematic` - a 101 x 61 build with no `park_contract`
    # and no anchors at all. The file that publishes the anchors is 69 x 97, rotated a quarter
    # turn against it, and 26 columns too wide for the 111 x 71 lot: it can never be placed as it
    # stands. Two artifacts of one name, and the signage was sited off the one nobody builds.
    #
    # Measured off `out/Park Complete.litematic` instead - the thing that actually stands:
    #
    #     concourse terrace   V24-25 x U100-120     two deep, twenty-one wide, the ride's forecourt
    #     station front wall  V26    x U103-118     solid, with openings at U100-102 and U106-108
    #     platform            V28-30 x U118-125     rails at V27 and V31, U119-123
    #     the running track   V32    x U102-142
    #
    # So the ride's front door is U100-120 and every piece of its signage stood at U126-146 -
    # three to twenty-six columns past the east end of the concourse, in front of the blank flank,
    # on bare lawn. Walking the marquee from U126 to U134 (which this file did once) moved it
    # further from the door, not nearer. **A DECLARED ANCHOR IS ONLY EVIDENCE ABOUT THE ARTIFACT
    # THAT DECLARES IT**; when two files share a name, measure the one the merge actually reads.
    #
    # The pieces now stand on one line: the spur, the arch and the station's door are all U107,
    # and the exit gate opens on the platform's own way out at U119-123.
    #
    # **THE ENTRANCE PORTAL IS RETIRED, AND THE FORECOURT IS WHY.** It was a third freestanding
    # frame on a concourse that measures 21 cells, whose west quarter is the U96 junction's own
    # paved apron (V21 out to U103) and whose U105 carries a crossing corner lamp. Every position
    # that clears both stands within a cell of the marquee's west pier, so the three come out as
    # one continuous 19-cell band - which is the wall of frontage this pass exists to undo,
    # rebuilt twenty cells west. A marquee IS an entrance arch by its own docstring; what a guest
    # needs here is one arch to walk under and one gate to come out of.
    - kind: portal
      name: Mine Coaster exit
      # U120, SO THE OPENING IS U119-121 - the concourse's own east end, and the 3-wide
      # exit spur runs through it. At U121 the opening was U120-122 and two of its three
      # cells were lawn past the end of the paving: an arch on the grass beside a
      # building, which is what Jack called the random extra arch.
      at: [21, 120]
      mode: exit
      title: RIDE EXIT
      lines: ["", "", "no re-entry"]

    # ---------------------------------------------------------------- the station's own front
    # **THE SIGN WAS RIGHT AND THE THING IT POINTED AT WAS A BOX.** Jack, on the moved signage:
    # "that entrance looks like shit still, you havent fixed a damn thing." Measured off
    # `out/Park Complete.litematic`, the coaster's station is a floor and a roof SEVEN COURSES
    # UP - h2 to h6 is air but for two one-cell posts - so a guest sees a 16 x 5 slab of one
    # brown material with two unframed holes in it under an overhanging lid.
    #
    # A ride station is a COVERED PLATFORM, and what makes one read is the timber holding the
    # roof up. This is that timber: posts on the concourse at V25, a head beam under the eaves at
    # h6, knee braces at every post head, a fascia a cell forward so the flat lid gets a shadow
    # line, and a lantern hung in each bay.
    #
    # `width: 16` at U111 is exactly the station's own front, U103-118. `door` is the opening at
    # U106-108 in frontage offsets, so no post stands in the doorway and the jambs go either side
    # of it instead - the arch, the spur and this bay are all on U107.
    #
    # **AND A FALSE FRONT, BECAUSE A FLAT LID IS WHAT MAKES A BUILDING READ AS A BOX.** Jack, on
    # the porch alone: "we need this entry to be something real not a strange brown blob of
    # crap." The station's wall is `spruce_planks` and its roof is a flat plate of
    # `spruce_planks` and `stripped_oak_log` with a bare edge - 16 x 5 of one brown under a lid.
    # Measured, V24-25 above h7 is EMPTY across the whole front, which is a 2 x 6 x 21 envelope
    # sitting exactly where a gold-rush depot puts its false front. So: a parapet across the
    # width at h8-h10, a bay over the DOOR rising to h12 carrying the name, and a red band
    # tying it to the arch below.
    #
    # **IT IS MASONRY AND THE FIRST ONE WAS NOT.** Built in the verandah's own timber it
    # disappeared: `spruce_planks` is L88.8 and `stripped_spruce_log` L92.8, four apart, so
    # against a spruce wall under a spruce roof the whole entrance was one brown mass. The
    # ladder is across families - blackstone plinth 44.6, spruce name panel 88.8, stone
    # brick field 122.0, smooth stone coping 159.0.
    #
    # **THE BAY IS CENTRED ON THE BUILDING, NOT ON THE DOOR.** Put on the door at U107 it stood
    # three cells behind the arch and carried a red band and a name of its own - two name boards
    # on one axis, and from the promenade the arch's fascia covered the depot's. The axis that
    # has to line up is the WAY IN (spur, arch, door, all U107); a building's name goes on the
    # middle of the building. At U111 the two read as a gate in front of a depot rather than as
    # one lumpy stack, and the arch is timber against the front's masonry.
    #
    # `pylon: true` puts the only thing on this frontage that is NOT brown. The wall, the roof
    # and this colonnade are three browns; `stone_bricks` (L122) and `smooth_stone` (L159) are
    # the one real value step this land's palette has at cheap tier, and two piers at the ends
    # are what stop a colonnade reading as a fence.
    - kind: porch
      name: Mine Coaster station front
      at: [25, 111]
      width: 16
      height: 6
      bay: 4
      door: [-5, -3]
      pylon: true
      roof: 7
      parapet: 3
      bay_at: 0
      bay_width: 7
      bay_rise: 5
      title: Mine Coaster
      lines: ["depot"]

    # ---------------------------------------------------------------- the queue: DELETED
    # **THE RIDE ALREADY HAS ONE, AND THIS WAS A SECOND ONE IN THE WRONG PLACE.**
    # `Mine Coaster.scan.json`: `queue_rows: 22`, `queue_cells: 67`, `queue_covered: 12`, and its
    # own contract reads "the queue is 3 wide and 22 rows" leading to a platform whose board and
    # unload are opposite flanks. The coaster builds its own.
    #
    # What stood here was a 7 x 30 switchback at world V27-33 / U161-190: thirty-five cells south
    # of the ride's own queue entry at U126, on the far side of the ride from all four of its guest
    # anchors, and **half of it past U169, which is outside the Frontier altogether** and into the
    # Claim Line reach.
    #
    # The comment that justified it said it stood on "the open lawn down the Mine Coaster's EAST
    # flank" - and V27 is its WEST flank. The site was picked from the biggest empty strip in the
    # land rather than from where the ride's door is, which is exactly how a queue ends up
    # pointing away from the thing it queues for.

    # ---------------------------------------------------------------- sight pieces
    # THE MEASURED TROUGHS ARE THE PRIORITY, and 95.5% of everywhere a guest can stand in this
    # park is in the bottom ten courses - so a sight piece three blocks tall does not carry
    # twenty blocks of walking. The tower is twenty.
    - kind: sight
      name: Ridge Water Tower
      motif: water_tower
      at: [72, 161]
      height: 12
      title: WATER No.2
    - kind: sight
      name: Ore Road
      motif: ore_cart
      at: [92, 165]
      length: 5
      title: THE HAUL ROAD
      lines: ["ran to the head", "of the cutting"]
    - kind: sight
      name: Trail Ore Cart
      motif: ore_cart
      at: [117, 155]
      length: 7
      title: MATRIX TIP
      lines: ["spoil and rock", "keep clear"]

    # ---------------------------------------------------------------- back of house
    # A THEME PARK DOES NOT MARQUEE ITS SERVICE YARD; IT MARKS IT. An exit-mode portal with no
    # accent and no lamp is the right shape for a door guests are meant to walk past.
    - kind: portal
      name: Works Yard staff gate
      at: [151, 136]
      facing: west
      mode: exit
      title: STAFF ONLY
      lines: ["works yard", "", "no admittance"]
roles: [construction]
design:
  purpose: path
  hierarchy: supporting
  style: frontier
  narrative: >
    The Frontier's frontage: a name board over every attraction's own spur, entrance and exit
    thresholds flanking the Mine Coaster's approach, a switchback queue down the coaster's east
    flank, a water tower and two ore-cart props in the land's empty bands, and a staff gate on
    the works yard. Nothing below the build plane, nothing in a walkway, no street furniture.
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  verify_against: out/Park Complete.litematic
  # The lawn's own scatter. `Park Ways` lays moss carpet across every lot at the course this
  # design builds on; it is what a builder clears with one swing before placing.
  verify_replaceable: [moss_carpet]
origin_lock: false
