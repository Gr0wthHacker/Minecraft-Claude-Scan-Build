# The taproot's passage through the deck - the root the room was always supposed to be about.
#
# THE STORY FAILURE THIS FIXES. The sequence is meant to run: a mystical, half-apocalyptic plate
# with giant animals -> an interior that holds the awe -> a descent down the taproot to the void.
# The deck is the hinge. And the taproot TOPS OUT AT Y188, six courses below the deck floor, so the
# one room whose whole purpose is to hand you to the root never shows you the root. You cross a
# grey workshop and find a hole.
#
# It is not an invention. configs/taproot.yaml already says "The centre tree's roots break through
# the deck skin and twist down into the void" - it just stops short. Reading the capture through
# the root's own 90-cell footprint:
#
#   Y190      the belly skin, 90/90 moss    the island's underside
#   Y189      EMPTY                         <- the gap
#   Y188      70 cells of taproot           the root's head
#
# IT STOPS AT THE BELLY SKIN. The first version carried the root all the way up through the
# undercroft, the deck floor, the room and the ceiling to the tree at Y203. That was the right
# story and the wrong site: the tree's base is a MACHINE ROOM - 66 redstone parts spanning
# X-24209..-24195 / Y191-203, including a sculk sensor at -24199 201 30019 shielded by 68 wool
# cells - and no 4-radius column anywhere clears it by 5. It put 256 cells within 8 of that sensor.
#
# The gap that actually needed closing is one course. Filling Y189-190 makes the root continuous
# into the island's underside, which is the view that matters: you see it from BELOW, descending
# the root stair. The break at Y190 is HEAVED rather than cut - cracked masonry shoved aside, some
# cells simply gone - so it reads as something that came through rather than a drilled hole.
name: Root Break
gen: rootbreak
params:
  under: out/island_now.litematic
  x: -24200
  z: 30018
  y_from: 188        # the taproot's head
  y_to: 190          # the belly skin, and no further: Y191+ is the tree door's machine room
  strands: 3
  trunk_r: 3.0
  strand_r: 1.5
  spread: 4.0
  twist: 2.0
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  verify_against: out/island_now.litematic
