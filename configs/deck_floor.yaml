# The working deck's floor: resolve the scatter, draw an edge, shut the moss farm in a room.
#
# WHY. The deck's 2,145 floor columns are a patchwork of six materials - 1,060 dressed brick,
# 499 green (ONE real 269-cell moss farm plus 230 cells of scatter), 266 rough stone and cobble,
# and 236 cells of vine in 127 separate blobs. About 730 cells across 113 blobs are noise rather
# than design, and only 44% of the floor is walkable with three courses clear.
#
# That patchwork is also why the taproot entrance does not read: its apron is grey on a grey field.
# An entrance cannot be the figure when the ground is the same tone and equally busy, so quieting
# the floor is the other half of building the entrance, not a separate job.
#
# The moss farm is WORKING - 29 ice, 12 water, glow lichen - so its wall follows the farm's own
# dilated edge and never cuts a mechanism. A rectangle will not do: the box one cell out from the
# farm is 58% air and two cells out 70%, because the farm sits on an irregular lobe of deck.
#
# ZONES are the fixture clusters measured off the capture, outlined in the floor rather than walled,
# so they separate the working areas without eating the headroom.
name: Deck Floor
gen: deckfloor
params:
  under: out/island_now.litematic
  floor_y: 194
  # NO BORDER. Of the deck's 260 outer-boundary cells, 92 are vine and 64 moss - the hem's
  # planting, which is deliberate - and 139 more carry fixtures, so a hard edge course lands on
  # 82 of them. A third of a line is a dashed scribble. The first build drew it on all 529 rim
  # cells including 269 HOLE edges, which put dark rings round 94 interior gaps.
  border_ring: 0
  room_h: 3
  room_glass_at: 2
  lamp_every: 7
  # NO LINK, and this is a decision rather than an omission. The moss farm's 247 walkable cells
  # are their own island - but so is everything around it: the deck's whole WEST WING is separate
  # from the main deck, and the farm was already unreachable before any of this work (0 of 262
  # cells connect in the base world). Every automated shortest route between the two crosses the
  # farm's WATER CHANNEL at Y193 and the room's own wall. `links:` exists and works; where the
  # bridge should land is Jack's call, not a nearest-point guess through a working farm.
  links: []
  zones:
    - [-24210, 30024, -24199, 30032]   # the sorter / machine block
    - [-24211, 30039, -24191, 30043]   # the bee row
    - [-24208, 29999, -24197, 30013]   # the taproot entrance hall
finish:
  # YIELD to the designs that own these cells. Overlap is not a rendering problem, it is a
  # WORK problem: you place a block, the next placement says it is wrong, you break it and
  # place it again. Precedence runs Root Break > Taproot Entrance > Deck Gallery > Deck
  # Floor - the root breaks through everything, so it wins everywhere it touches.
  defer_to:
    - out/Root Break.litematic
    - out/Taproot Entrance.litematic
    - out/Deck Gallery.litematic
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  verify_against: out/island_now.litematic
