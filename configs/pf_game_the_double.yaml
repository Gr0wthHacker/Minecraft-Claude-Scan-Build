# PF GAME THE DOUBLE - fitted into PF Skill Arcade.
#
# A CONSOLE, NOT A BOOTH: the machine sits in a cabinet on the room's own floor and writes
# only into air, so it shares no cell with the building it stands in. `refused` in the
# sidecar is the count of cells the capture would not give up - it must be zero, or the
# machine is missing a piece and does nothing.
name: PF Game The Double
gen: park_games
params:
  kind: pair
  land: midway
  facing: south
  at: [97557, 204, 80670]
  building: PF Skill Arcade
  under: out/Park Complete.litematic
  title: 'THE DOUBLE'
roles: [ride]
design:
  purpose: ride
  hierarchy: supporting
  style: midway
  narrative: >
    Bay three: two buttons twelve cells apart and one lamp between them. It is the only game in the park that cannot be played alone.
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  verify_against: out/Park Complete.litematic
origin_lock: false
expensive_allowance: 1
expensive_reason: >
  1x redstone_lamp - a light cannot be substituted by colour (the nearest cheap match is a lamp that does not light), and the lamp IS the score this game shows, so the cost is declared rather than hidden
