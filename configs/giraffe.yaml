# A giraffe standing on the void isle, craning up at the taproot platform.
#
# It stands on the FAR side of the isle - the island with the water - so the neck reaches back across
# the lake toward the platform, and the head arrives level with the platform's rim about 26 blocks
# away. That is the "just peeking" distance: close enough to read as looking at you when you are on
# the platform, far enough that it is not leaning on it.
#
# Feet at Y100 (the isle's far surface), head at Y150 (the platform shelf). The height is not chosen -
# it falls out of those two numbers.
#
# PALETTE AND FORM COME FROM JACK'S REFERENCE BUILD, not from guesswork. Two corrections it forced:
#   - Muted clay, not bright wool. Earth-brown blotches on bone_block. orange_wool read as a toy.
#   - Rectangular masses, not ellipsoids, and the heading snapped to a cardinal so they stay square
#     to the grid. Rounded blobs are what made the first two versions look melted.
name: Void Giraffe
gen: giraffe
params:
  under: out/island_void.litematic
  feet: [-24218, 100, 29982]      # far NW side of the void isle
  look_at: [-24206, 150, 30010]   # the taproot platform's near rim
  leg: 22
  hoof: 4
  body: [18, 10, 11]        # length, depth, width - a deep slab with a shoulder hump
  neck: 19
  neck_w: 5                 # thick. A 2-wide neck is a pipe, not a giraffe
  head: [9, 6, 7]           # big enough to carry a readable eye, ear and muzzle
  coat: bone_block          # cheap tier, and the exact cream of the reference
  patch: packed_mud         # dirt + wheat. terracotta is the reference colour but costs 10 grass
                            # EACH - ~14,400 grass for the coat, for a hue you cannot tell apart.
  hoof_block: dark_oak_log
  dark: black_wool
  patch_scale: 3            # ~6-block patches, matching the reference. 5 gave one blob per limb
  patch_rate: 0.53          # ~42% clay, matching the reference. Cream must stay dominant
  seed: 0
origin_lock: false          # LOUD: it stands at Y100-150, its own corner; nothing else is near it
finish:
  cheapen: false            # the coat IS the design
  hollow: false
  ground: false
  drop_floaters: false
  context_clear: [vine]
  verify_against: out/island_void.litematic
