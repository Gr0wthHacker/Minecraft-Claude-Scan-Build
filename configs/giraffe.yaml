# A giraffe standing on the void isle, craning up at the taproot platform.
#
# It stands on the FAR side of the isle so the neck reaches back across the lake toward the platform
# and the head arrives at the rim about 26 blocks away - close enough to read as looking at you when
# you are on the platform, far enough that it is not leaning on it.
#
# Everything about the ANIMAL now lives in `PROFILES["giraffe"]` in mcbuild/gen/quadruped.py: the
# proportions, the section keyframes, the coat, which features it wears. This file only says where it
# stands and what it looks at. A second giraffe elsewhere is four lines.
#
# Audit it with:
#   python tools/proportions.py "Void Giraffe"          measured against a real giraffe
#   python tools/smoothness.py configs/giraffe.yaml     spikes, notches, area jerk
#   python tools/views.py "Void Giraffe" --zoom 10      shaded side / face / top
name: Void Giraffe
gen: quadruped
params:
  profile: giraffe
  under: out/island_void.litematic
  feet: [-24218, 100, 29982]      # far NW side of the void isle
  look_at: [-24206, 150, 30010]   # the taproot platform's near rim
origin_lock: false          # LOUD: it stands at Y100-156, its own corner; nothing else is near it
finish:
  cheapen: false            # the coat IS the design
  hollow: false
  ground: false
  drop_floaters: false
  context_clear: [vine]
  verify_against: out/island_void.litematic
