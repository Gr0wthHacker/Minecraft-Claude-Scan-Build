# A giraffe standing on the void isle, craning up at the taproot platform.
#
# It stands on the FAR side of the isle - the island with the water - so the neck reaches back across
# the lake toward the platform, and the head arrives level with the platform's rim about 26 blocks
# away. That is the "just peeking" distance: close enough to read as looking at you when you are on
# the platform, far enough that it is not leaning on it.
#
# Feet at Y100 (the isle's far surface), head at Y150 (the platform shelf). The height is not chosen -
# it falls out of those two numbers.
#
# Coat is cream with orange blotches: 851 orange wool are already on the island, all cheap tier.
name: Void Giraffe
gen: giraffe
params:
  under: out/island_void.litematic
  feet: [-24218, 100, 29982]      # far NW side of the void isle
  look_at: [-24206, 150, 30010]   # the taproot platform's near rim
  leg: 20
  body: [13, 8, 8]
  neck: 18
  coat: white_wool
  patch: orange_wool
  dark: black_wool
  muzzle: light_gray_wool
  patch_scale: 3
  patch_rate: 0.52
  seed: 0
origin_lock: false          # LOUD: it stands at Y100-150, its own corner; nothing else is near it
finish:
  cheapen: false            # the coat IS the design
  hollow: false
  ground: false
  drop_floaters: false
  context_clear: [vine]
  verify_against: out/island_void.litematic
