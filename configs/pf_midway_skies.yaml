# PF MIDWAY SKIES - the fair's airship, and the display going off over the wheel.
#
# Jack: *"this applies to carnival area as well we can have sky elements etc and more visual design
# etc."* The Midway's sky is the OPPOSITE problem to the Lost Plateau's and wants a different
# answer. Measured over the park as placed:
#
#     Lost Plateau   0.88% of its mass above Y250   ONE object, perched on a crag
#     Midway         6.70%                          the Wyrm Gate 17,555 and the Sky Lift's tower
#     Midway         165 cells above Y270           ...and NOTHING AT ALL above Y280
#
# So this land already has a MIDDLE sky - a skull you ride a train through, a wheel topping out at
# Y276 - and then fifty courses of nothing over it. It is short of ALTITUDE, not of mass, and a
# second floating mountain here would crowd the things that are already up there.
#
# Sited off the headroom map. The tight block is x97625-97699 / z80570-80699 (the wheel, the helter
# skelter, the Wyrm Gate) at 42-80 courses; everywhere else runs 90-114. Every piece here stands in
# a block with 99 or more, and all of it is on the entrance axis a guest walks in along.
name: PF Midway Skies
gen: carnivalsky
params:
  anchor: [97500, 203, 80470]      # V -> world X, U -> world Z
  lot: [200, 230]
  at: [0, 0]
  sy: 115                          # Y203..Y317
  seed: 19
  # THE AIRSHIP, broadside to the entrance walk. A guest comes in through the west gate and walks
  # east along z80594-80606 toward the wheel; the ship's long axis is Z, so from that walk it is
  # seen full length rather than end-on - which for a fifty-six block capsule is the difference
  # between a landmark and a dot. It crosses at x97595, forty blocks short of the wheel, so it
  # reads AGAINST the wheel rather than hiding it.
  ship:
    at: [95, 100]                  # x97595, z80570
    y: 292
    facing: north
    length: 56
    beam: 7
  # THE BURSTS, over and beyond the wheel, at three heights and three colours so they read as a
  # display rather than as one object repeated. Radial spokes off a bright core - pure columns,
  # nothing volumetric, and a firework is the one image a fairground sky is known by.
  bursts:
    - at: [140, 160]               # x97640, z80630 - straight over the wheel
      y: 301
      r: 12
      spokes: 17
      colour: gold
    - at: [172, 105]               # x97672, z80575
      y: 287
      r: 9
      spokes: 14
      colour: rose
    - at: [116, 190]               # x97616, z80660
      y: 296
      r: 10
      spokes: 15
      colour: blue
roles: [construction]
design:
  purpose: landmark
  hierarchy: landmark
  style: midway
  narrative: >
    The fair's own airship standing over the entrance walk in the Midway's red, white and yellow,
    with three rockets bursting beyond it above the big wheel - the first things in this land that
    are higher than the wheel, and the only ones a guest has to look up to see.
finish:
  cheapen: false
  hollow: false
  ground: false
  # DISCONNECTED IS THE DESIGN - see `configs/pf_plateau_skies.yaml` for the same trade. One
  # component would mean the airship was touching a burst.
  drop_floaters: false
  verify_against: out/midway_sky_ctx.litematic
origin_lock: false
