# THE HARBOR LIGHT - a beacon at the root of the quay (2026-08-22).
#
# The pond is the harbor and a harbor gets a light. The quay's lip is a diagonal ribbon one to
# three cells wide (measured), so the tower stands at the mole ROOT - dry moss plus the quay's
# own corner masonry, four clear of the landing steps, six of the watergate - and rises over
# the whole quay in the west-bank money view with the ring behind. Not one water cell is
# replaced: where the plinth would reach the pond it stops, and the torn lakeward edge is the
# ruin. The lamp is a soul lantern in an open lightroom - the harbor's light is cold, like its
# mooring post, which is the quarter's colour system.
name: Lowland Harbor Light
gen: harborlight
params:
  under: out/island_full.litematic
  at: [-24204, 30018]
  base_y: 39                   # PINNED (shore ground 37-38 under the footprint)
  shaft_h: 9
  seed: 0
origin_lock: false             # LOUD: stands on the lowland shore at Y37-55
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  defer_to: [out/Lowland Portal.litematic, out/Lowland Ruinway.litematic,
             out/Lowland Sanctum.litematic, out/Lowland Axolotl.litematic]
  context_clear: [vine, short_grass, tall_grass, fern, large_fern, moss_carpet, azalea,
                  flowering_azalea, poppy, dandelion]
  verify_against: out/island_full.litematic
