# THE STALK, part one: the cat.
#
# A jaguar prowling the lowland floor, aimed at the capybara 43 blocks north of it. The pair is not
# decorative - jaguar and capybara is the real predator/prey relationship of the Pantanal, and it is
# the only one the eight species we build can express truthfully.
#
# ONE quarry, not the group of three first drawn up. The lowland measures 99x99 but its usable
# statue ground is far smaller, and these models are enormous: a prowling jaguar occupies 63 blocks
# end to end though it stands on only 29 of them, and a capybara is 50 deep because its head
# projects 31 blocks past its feet. Three capybara plus a cat plus a bear could not be placed
# without bodies intersecting - measured, not guessed. The site holds three animals of this size.
#
# WHY A JAGUAR DOWN HERE. The lowland is Minecraft's lush-caves palette - moss, azalea, fern,
# dripstone, lantern-lit, no daylight. That is a cave-mouth jungle floor, which is jaguar country;
# they den in caves, and in Maya cosmology the jaguar IS the night sun, the animal of the underworld.
# It also has the best contrast of anything we build against this ground (+15 luminance, min dRGB 37
# to any ground block) and its black rosettes carry at lantern range.
#
# The species is shape-identical to the leopard (built gap 0.13) - here CONTEXT settles it instead of
# geometry. The only cat stalking a capybara is a jaguar.
#
# Site from a search over the planned lowland: tree-free, fully on ground, relief 2, 24 blocks from
# the nearest prey and clear of every other animal by 3.
name: Lowland Jaguar
gen: quadruped
params:
  profile: jaguar
  # COUCHANT, not prowling, and the site chose it. `tools/stance.py` scored prowling 0.69 here
  # against couchant 0.83 - and the whole gap is SITE: a prowling cat's contact footprint is 13x63,
  # it lies along the ground for its whole length, and the ground under it here rolls 8 blocks.
  # Couchant measures 2.0. Behaviour agrees: couchant is the felid family's highest weight (1.00) -
  # it is what a cat spends most of its life doing.
  #
  # The scene is better for it. The capybara has SEEN the cat (it is staring straight back down the
  # line), so a stalk is already over. What is left is two animals watching each other, which is
  # both truer and more tense than a stalk the prey has not noticed.
  pose: couchant
  under: out/lowland_planned.litematic
  feet: [-24223, 40, 30014]
  look_at: [-24203, 40, 29976]     # the capybara - snaps the facing to -z
origin_lock: false           # LOUD: stands at Y40 on the lowland, ~160 below every other lock corner
finish:
  cheapen: false             # the coat IS the design
  hollow: false
  ground: false
  drop_floaters: false
  context_clear: [vine, short_grass, fern, moss_carpet, poppy, dandelion, azalea, flowering_azalea]
  verify_against: out/lowland_planned.litematic
