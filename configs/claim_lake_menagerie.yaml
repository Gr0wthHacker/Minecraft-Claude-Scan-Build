design:
  purpose: terrain
  hierarchy: supporting
  style: midway
  narrative: >
    A walk-through farmyard zoo on the Claim Lake's south side, filling the whole exit and
    observation lot: a gated frontage with two capped towers, a red timber barn you walk through
    with four railed stalls off its cross aisle, a sunken duck pond with a canopied jetty, an
    open sheep meadow with a shelter and a trough, a cage aviary under a lattice roof with a
    cupola on top, and a raised lookout terminating the spine - built empty, gated and signed for
    what to lead into each enclosure.
