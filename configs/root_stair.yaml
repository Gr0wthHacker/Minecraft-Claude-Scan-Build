# A helical stair wound around the taproot, from the shop islet up to the root's head.
#
# Radius is measured off the taproot per course, so the stair tapers with it: the root is 1.4 wide
# near its tip and 5.8 at its head. Pitch follows from the radius - one block of rise per step and an
# angular step of 1/r - so the treads always touch.
#
# Below-island origin, same corner as the islet: see the note in configs/shop_islet.yaml.
name: Root Stair
gen: spiral
params:
  under: out/island_deep.litematic   # island_now is cut at Y150; below-island work needs deeper
  around: out/Taproot.litematic
  center: [-24200, 30018]
  y0: 152                   # first tread, one step up off the islet shelf
  y1: 186                   # the deck skin is solid at Y189, so stop with 2 clear above the landing
  clearance: 2              # inner edge of the tread, outside the root
  min_radius: 3.0           # the inner edge sets the pitch: one cell of arc there per half-step
  start_angle: 1.35         # radians. Swept every rotation against the climb check and the
                            # collision count: this one clears the shop awning and the old
                            # build with a single overlapping cell.
  direction: 1
  width: 4                  # tread depth outward from the inner edge, as in the reference
  slab: stone_brick_slab        # ONLY slabs: bottom then top gives 0.5 a tread, and a slab has no
  slab_alt: mossy_stone_brick_slab   # facing or shape, so the curve costs nothing
  alt_rate: 0.35
  rail: stone_brick_wall
  lantern_every: 12
  seed: 0
origin_lock: [-24251, 130, 29949]   # below-island corner, NOT the global one
finish:
  climb: true               # gate it: this design shipped unclimbable once
  cheapen: true
  hollow: false
  ground: false
  drop_floaters: false
  context_clear: [vine]     # any cut truncates vine strands at its top edge, and the orphans are
                            # the box's fault, not this design's
  # both cuts: deep covers Y130-215, island_now Y150-270. Merged they have no interior edge,
  # so nothing gets flagged just for hanging past the top of a box.
  verify_against: [out/island_deep.litematic, out/island_now.litematic, out/Taproot.litematic, out/Shop Islet.litematic]
