# LOUD NOTE, per rule 1: this design does NOT use the global origin_lock. It spans Y29-214,
# the whole inhabited island, so the Y150 lock cannot hold it.
origin_lock: [-24251, 20, 29949]

finish:
  cheapen: false          # every fixture is chosen by idiom, never by colour
  hollow: false
  ground: false
  drop_floaters: false
  verify_against: [out/island_full.litematic]
  # BUILD THIS LAST, and it is a hard dependency rather than a preference. The night pass is a
  # FIXPOINT solved against the finished world: a fixture standing in a surface cell makes that
  # cell impassable, so the topmost standable block moves down and a spot that was hidden becomes
  # a real spawn. Pointed dripstone is the one plant here that is not passable, so the Thicket
  # moves the surface under this solution, and the Falls opens water that was rock.
  #
  # This is written down here because until now it was written down only in prose. `/cscan follow
  # all` walked the tracked list as it came and could have solved the night against a world two
  # designs short of finished; `Designs.inBuildOrder` reads this list and orders the run.
  after: [Falls, Lowland Thicket]
