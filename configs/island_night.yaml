# THE ISLAND NIGHT - the lighting pass for the whole island, solved rather than sprinkled
# (2026-08-23). The lowland glow did this for one scene; this is the same operation from the
# lowland floor to the plate, and it uses the SAME generator because it is the same operation.
#
# WHAT THE PROPAGATION FOUND. Block light was propagated through the whole assumed-final world
# (the 15:54 capture, everything accepted as complete, plus the Falls) and the walking surface
# classified - topmost standable cell per column, never the lowest, which is the classifier
# that has now misled this project three times. Of 6,851 walkable cells, 1,420 were spawnable:
#
#   1,067 open to the sky   dark only at night
#     353 enclosed          dark day and night - the real problem
#
# AND THE DARK WAS MOSTLY NOT FLOOR. It was the TOPS OF SCULPTURES: the ladybird 361 cells, the
# owl 121, the bat 38, the gecko 20, the axolotl's back, plus tree canopies. Light placed where
# a player walks never reaches a crown, and a spawnable crown puts a zombie on the artwork.
#
# THE RULE THAT SHAPED THE SOLVE: light reaches 14 blocks, so a sculpture can almost always be
# lit from ORDINARY GROUND standing near it. Cost encodes that - ground is cheap, a coat is
# dear - so the greedy cover lands on an animal only where nothing else can reach. 107 fixtures
# take the whole island to ZERO spawnable surface cells, verified by re-propagation and pinned
# in tests/test_island_night.py.
#
# ONE IDIOM PER SURFACE, all of them already spoken on this island:
#   turf          -> ochre froglight, FLUSH (the cell is dug): Jack's own, 39 already placed
#   worked stone  -> lantern, warm, above Y100
#   blackstone    -> soul lantern: the underworld is cold, and the gradient is the point
#   a living coat -> glow lichen, face-down
#
# WHY LICHEN LANDS WHERE IT DOES, MEASURED NOT GUESSED. The guess was that lichen hides on the
# ladybird's black spots. The colour DB says the opposite: glow_lichen is a mid grey-green
# (112,131,122), so against black wool it is a pale blotch (dLum 105) and against the leaf it
# vanishes (lime 32, green 27). Cost rises with the square of that contrast, which is what
# moved the lichen off the shell and onto the leaf it sits on.
#
# THE ONE GROUP TO DELETE IF YOU DISLIKE IT: 14 of the 26 lichen are on the ladybird and its
# leaf, because it hangs in the void with no ground within reach of its shell. Empty that part
# of `lichen` and 361 cells go dark again - stated here so the trade is yours and not silent.
name: Island Night
gen: lowglow
params:
  under: out/island_full.litematic
  # solved against a world that already has the Falls cut, the Thicket planted and the
  # Enrichment hung and the Run's 77 pads placed. Stairs and dripstone are not passable so
  # both move the classifier; the Run adds 550 walkable cells and needs NO extra fixture,
  # because every landing on the Run IS a froglight - which it has to be, since when the
  # night pass solved those ledges instead it put 14 lanterns in the cells you must land on:
  # pointed dripstone is not passable, so a stalagmite can move the surface classifier
