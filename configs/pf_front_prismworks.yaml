# PF FRONT PRISMWORKS - the grammar that turns Prismworks' buildings into attractions.
#
# The cold land, so nothing here is a fairground. Its marquees are apparatus rather than boards:
# smooth basalt piers, a cyan signal band, a soul lantern, and the crown lit from inside with
# pearlescent froglight - the same value ladder `prismworks_builds` gives the buildings behind
# them (`polished_blackstone_bricks` 45 < `smooth_basalt` 73 < `light_blue_wool` 145), measured
# ACROSS material families because inside one a ladder cannot exist by construction.
#
# TWO OF THE PARK'S FOUR MEASURED TROUGHS ARE IN THIS LAND. U520-539 has 25 built columns against
# 1,668 free and U580-599 has 168 against 1,812: a visitor walks the last fifth of the park past
# nothing at all. The signal pylons and the queue below stand in both, and both are tall, because
# 95.5% of everywhere a guest can stand in this park is in the bottom ten courses and a three-
# block prop cannot carry twenty blocks of walking.
name: PF Front Prismworks
gen: park_frontage
params:
  land: prismworks
  anchor: [97500, 203, 80300]
  seed: 43
  pieces:
    # ---------------------------------------------------------------- marquees, on the spurs
    - kind: marquee
      name: Foundry Gate
      # NO WING, AND THE REASON IS THE PLAZA. The spine's round junction at the U468 avenue is
      # r11, so its paving reaches U457 - and a winged gantry's outer bay would land two piers
      # in it. The land's threshold is made grand in height and fascia instead.
      at: [20, 448]
      span: 7
      height: 9
      board: 3
      title: PRISMWORKS
      lines: ["the works", "mind the light"]
    - kind: marquee
      name: Prism Well
      at: [20, 496]
      span: 7
      height: 8
      title: THE PRISM WELL
      lines: ["look down", "then climb down"]
    # AND EVERY HEAD BEAM HERE IS AT EIGHT, NOT SIX. A verge lamp mast is a different height in
    # every land - measured off the shipped ground layer, frontier tops out at Y206, the Midway at
    # Y208 and Prismworks at Y210, because this land's mast carries an end rod over its lantern.
    # A marquee's opening may cross a mast and usually must, since the spur it straddles and the
    # mast beside it sit on the same line; so the beam goes above the tallest thing the ground
    # layer builds, and here that is two courses higher than anywhere else.
    #
    # THE ASCENT TAKES NO WING. `Park Ways` puts a lamp mast on the verge line every 22 cells and
    # the outer bay of a winged gantry here would land on the pair at U576-577 - so the piece is
    # made grand in HEIGHT instead, which is also the right register beside an 84-course spire.
    - kind: marquee
      name: Prism Descent
      at: [20, 563]
      span: 7
      height: 8
      board: 3
      title: THE DESCENT
      lines: ["86 jumps down", "free practice"]
    - kind: queue
      name: Prism Descent queue
      at: [26, 585]
      width: 9
      depth: 24
      leg_every: 3
      title: DESCENT LINE
      lines: ["one runner at", "a time", "practice free"]
    - kind: portal
      name: Prism Well entrance
      at: [21, 486]
      mode: entrance
      title: WELL ENTRY
      lines: ["rim gallery", "", "free to watch"]
    - kind: portal
      name: Prism Well exit
      at: [21, 506]
      mode: exit
      title: WELL EXIT
      lines: ["", "", "lift returns"]

    # ---------------------------------------------------------------- the two empty bands
    # A RELAY IS A LINE OF THE SAME THING, AND THAT IS WHY IT WORKS HERE. One tall pylon in a
    # twenty-wide band is an object; three of them marching away down it, each shorter than the
    # last, is a DIRECTION - and the two bands this land has to answer for are 70 and 100 courses
    # deep, which is a long way to look into. Each line ends on a lens: something you only find
    # by walking to it.
    - kind: sight
      name: Foundry Relay One
      motif: pylon
      at: [58, 435]
      height: 16
      title: SIGNAL 1
      lines: ["foundry relay"]
    - kind: sight
      name: Foundry Relay Two
      motif: pylon
      at: [86, 435]
      height: 12
      title: SIGNAL 2
      lines: ["foundry relay"]
    - kind: sight
      name: Foundry Lens
      motif: lens
      at: [110, 435]
      radius: 3
      title: SPARE LENS
      lines: ["cast for the", "array, unused"]
    - kind: sight
      name: Array Relay One
      motif: pylon
      at: [30, 534]
      height: 20
      title: SIGNAL 3
      lines: ["array relay"]
    - kind: sight
      name: Ascent Relay
      motif: pylon
      at: [70, 590]
      height: 15
      title: SIGNAL 6
      lines: ["ascent relay"]

    # ---------------------------------------------------------------- back of house
    - kind: portal
      name: Service Gallery staff gate
      at: [151, 570]
      mode: exit
      title: STAFF ONLY
      lines: ["service gallery", "", "no admittance"]
roles: [construction]
design:
  purpose: path
  hierarchy: supporting
  style: prismworks
  narrative: >
    Prismworks' frontage: signal-mast gantries over the Foundry, Array and Ascent spurs, a
    one-course gantry on the Vault's and the Forge Deck's own short spurs, queue lines for the
    two experiences that genuinely wait, entry and exit thresholds on the Array, and two lit
    pylons and two spare lenses standing in the land's two measured empty bands.
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  verify_against: out/Park Complete.litematic
  verify_replaceable: [moss_carpet]
origin_lock: false
