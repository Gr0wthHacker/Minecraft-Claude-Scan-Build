# PF GAME PRIZE POINT - fitted into PF Prize Point.
#
# A CONSOLE, NOT A BOOTH: the machine sits in a cabinet on the room's own floor and writes
# only into air, so it shares no cell with the building it stands in. `refused` in the
# sidecar is the count of cells the capture would not give up - it must be zero, or the
# machine is missing a piece and does nothing.
name: PF Game Prize Point
gen: park_games
params:
  kind: counter
  land: midway
  facing: south
  at: [97597, 204, 80657]
  building: PF Games Row
  # **THE CONSOLE'S CONTEXT IS THE GROUND LAYER, NOT THE COMPOSITE IT ENDS UP IN.** Pointed at
  # `Park Complete` this design read a world that ALREADY CONTAINED ITSELF the moment it was
  # placed: `park_games` refuses every cell the capture owns, so a regenerate found its own
  # standing copy and shipped a 4-block stub of a 556-block machine, silently, with 0 problems.
  # A console is fitted to the ground it stands on - `Park Ways` paves it, `PF Park Green` plants
  # it, `PF Front Midway` signs it - and its own bay is reserved by `PF Games Row`, so nothing
  # else in the park can be in the way.
  under:
    - out/Park Ways.litematic
    - out/PF Park Green.litematic
    - out/PF Front Midway.litematic
  lanes: 3
  height: 3
  title: 'PRIZE POINT'
roles: [ride]
design:
  purpose: ride
  hierarchy: supporting
  style: midway
  narrative: >
    The midway's redemption counter: three prize windows whose lamps tell the truth about what is actually behind them, and a bell to call the attendant.
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
origin_lock: false
expensive_allowance: 3
expensive_reason: >
  3x redstone_lamp - a light cannot be substituted by colour (the nearest cheap match is a lamp that does not light), and the lamp IS the score this game shows, so the cost is declared rather than hidden
