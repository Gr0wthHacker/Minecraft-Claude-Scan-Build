# HALF A JAGUAR, DIVING OUT OF THE VOID ONTO THE LAND.
#
# Only the part east of the lowland's west rim is built. `tools/emerge.py` cuts the rest away at a
# vertical plane on the rim line, so the animal appears to come straight out of the empty air off
# the edge of the world - and every block saved on a hindquarter nobody can see goes into the half
# that is right in front of you. That is why it is built big: at the species' own height of 27 a
# jaguar's head is nine blocks and holds an eye and a muzzle and nothing else. Scaled up it holds a
# face.
#
# `leaping` pitches the barrel hard nose-down and trails the hind legs, and `leg_phase` pulls the
# diagonal pairs right apart - which is what makes it read as airborne rather than as an animal
# standing with its feet in a row. It costs about 25 points of symmetry; the rubric is told it was
# asked for. Nothing here touches the ground, so `stance.py`'s site score means nothing for it: a
# leaping figure is placed by what it is leaping AT.
#
# The floor was tried first and rejected. Cutting horizontally and having the cat erupt from the
# ground works, but it loses the dive - and the void off the rim is the more striking boundary to
# come out of, because there is visibly nothing there for it to have come from.
name: Lowland Jaguar Lunge
gen: quadruped
params:
  profile: jaguar
  pose: leaping
  scale: 1.7
  leg_phase: 5               # fore reaching, hind trailing: the shape of an animal in the air
  feet: [-24246, 40, 30014]  # above the floor at Y37, and clear of the void isle's Y86 ceiling
  look_at: [-24150, 37, 30014]     # east and down, at the fleeing capybara
origin_lock: false
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
