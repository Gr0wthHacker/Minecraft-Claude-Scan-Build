expensive_reason: >-
  Two declared spends, both confined and both load-bearing for the read.
  (1) ~178 cyan_stained_glass: the surviving panes of the mullioned observation
  viewport, RECESSED into the bow flank (dished a course into the hull and framed
  by the plating, not a blister stuck on top). The blown-out top and broken panes
  are dark cracks, not glass. A submersible's viewport is glass and no cheap block
  reads as translucent cyan. (2) ~380 cells of instrument trim on a vessel named
  the PRISMWORKS Sounder, trimmed in the prismarine it is named for: a
  dark_prismarine bridge coaming and scope housing, a tinted_glass scope optic,
  an amethyst dead-sensor lens on the snapped bow arm, and a handful of sea_lantern
  for the scope glint and the one surviving sensor, plus a prismarine_bricks sail
  insignia and a few sea_lantern lighting the fitted interior (reactor core, control
  room, observation gallery). Fine instruments and interior lighting only - nothing
  spent on skin - and pinned to their regions by the tests. Total under 600.
