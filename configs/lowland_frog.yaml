# THE FROG - the churchyard animal, in the lot east of the sanctum (2026-08-28).
#
# Jack: "build a frog, put it opposite end from axo, on the far empty lot left of the church".
#
# THE LOT WAS MEASURED, not chosen. Standing at the sanctum's door looking out (the facade
# faces south), the lot on its LEFT is the east one, and it is the far end of the lowland from
# the axolotl - which lies on the harbor's west bank ~50 blocks away, so the two animals never
# share a view. It is also the largest genuinely empty ground left down here: a dead-flat
# plain at Y39 spanning X-24177..-24162 / Z29972..29982, with 0 blocks standing above it,
# no lantern of the ground design's grid in it, and 113 blocks of headroom.
#
# WHY A FROG. The planar/columnar rule, third case: identity as a PATTERN ON A SINGLE CONVEX
# MASS - the ladybird's category, and the one the download corpus confirmed (a curled cat
# reads instantly because its legs fold into the mass; a standing one is a table). A sitting
# frog is that by anatomy: eye bulges on top, a mouth line past them, a long foot open on the
# ground. And frogs are the 1.19 mob - the naming test is instant, and Jack's own scattered
# ochre froglights come from them.
#
# NOT A FOLDED KNEE OVER THE BACK, which is what this said first and what four rebuilds tried
# to build. At thirteen wide there is no resolution for it: raised across the back it is a
# rucksack, raised at the flanks a floating rectangle. The mass is ONE CONVEX LOAF and the
# frog is carried by the COAT - see the generator's own docstring for the four that failed.
#
# THE GAZE IS CARDINAL AND IT LOOKS AT THE CHURCH. Due west, nose 3 clear of the sanctum's
# east wall, so the head is grid-straight (the axolotl's three-pass lesson) and the animal has
# something to be looking at. HEAD-ON is the strongest view by a distance and it is the one the
# approach from the church gives you; the profile - a squat loaf with the eye and the jaw line
# reading from the side - is what you get walking up the building's east flank, which is the way
# people arrive from the harbor.
#
# COLOUR IS THE REFERENCE'S OWN, matched by measurement: its body is mud brick, and both
# `mud_bricks` and `packed_mud` are CURRENCY on this server, so it is `jungle_planks` - 23 RGB
# off the first and cheap. Spruce planks for the dark blotches, a stripped oak log for the one
# light drift (the only cheap warm block that can draw a line against jungle at all: oak planks
# are 12 luminance away and invisible), a pale birch belly, dark oak for the mouth and jaw, a
# gold iris, a black band. Against the moss floor (89,110,45) the body is 80 apart in RGB - a
# full HUE flip, which is what the turtle proved carries here; the saturated orange this design
# carried for four passes was picked on LUMINANCE and is most of why it did not look like the
# statue. All cheap, all 1.19, none of it currency.
name: Lowland Frog
gen: frog
params:
  under: out/island_full.litematic
  at: [-24169, 29976]        # the body centroid. ODD length and width on purpose: with an even
                             # span every station lands on a .5 and round() is BANKER'S
                             # rounding, which is what once built a clod as eighteen separate
                             # one-wide towers
  facing: [-1, 0]            # due west, at the church
  base_y: 40                 # PINNED to the measured plain (ground Y39 across the whole
                             # footprint). Derived instead, a rescan of ground somebody is
                             # still planting moves the seat a course - the ring paid for this
  length: 13               # DEPTH nose to rump - a sitting frog is compact this way
  width: 15                # the largest pad the lot holds at roll <= 1
  height: 16               # ground to the CROWN; the eye boxes stand three above.
                           # UPRIGHT, and that is the whole rebuild - see the
                           # generator. The lot carries 107 courses of headroom, so
                           # height was always free and the footprint was the only
                           # constraint; built at eight courses there is no room
                           # for a head, arms or haunches and it came out a crate
                           # three times running
  lamps: []                  # THE LIGHT LIVES IN THE NIGHT PASS, not here. A new animal is new
                             # walkable surface and something must light it, but a fixture sunk
                             # in the turf is not part of the animal - carried here it would
                             # cost the design the one-connected-piece gate for four cells that
                             # belong to `Island Night`, which is where they are (froglights,
                             # because froglights come from frogs)
  glow: 5
  hand_lamp: true            # MEASURED, not chosen: without it the air over the hands
                             # stands at block light 0 - the back lamps are seven courses up and
                             # five forward, and light does not turn corners
  seed: 0
origin_lock: false           # LOUD: it sits on the lowland floor at Y39-48
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  # generated AFTER the quarter and the thicket, so it yields any shared cell to them
  # THE FROG DOES NOT DEFER TO THE THICKET, and that is a decision rather than an oversight.
  # The Thicket is scattered plants - moss carpet and ferns, unbuilt - and it drops sixteen of
  # them inside this footprint. Deferring to it took a cell the hind foot was hanging on and
  # left that foot standing alone on the turf; the pipeline's own post-defer sweep keeps such a
  # cell, correctly for a building, because it touches the ground. For an ANIMAL a cell attached
  # only to the ground is an orphan. A sculpture beats a moss carpet, `context_clear` below
  # already says this design clears plants, and the Thicket has not been built.
  defer_to: [out/Lowland Sanctum.litematic, out/Lowland Ruinway.litematic,
             out/Island Night.litematic]
  context_clear: [vine, short_grass, tall_grass, fern, large_fern, moss_carpet, azalea,
                  flowering_azalea, poppy, dandelion, glow_lichen]
  verify_against: out/island_full.litematic
