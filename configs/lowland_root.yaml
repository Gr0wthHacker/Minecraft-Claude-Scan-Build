# THE REACHING ROOT - off the shop islet's south rim, down to the lowland earth (2026-08-22).
#
# Jack: the spiral staircase continues all the way down to the lowlands - and it has to ALIGN
# with the actual stair, straight down the same axis, breaking the islet's floor where it must
# (his call, 2026-08-22, overriding the offset siting that dodged the harbor). So the root now
# hangs from the TAPROOT'S OWN KEEL at (-24200, 30018) - the real mass, dead on axis, no bend -
# and the harbor light moved to the west bank to clear the landing (see its config). The root
# stops at Y95 - see y_tip below; the stair carries on alone past the tip.
#
# The Void Ladybird's parked site was in this shaft (726 cells at Y104-120) - re-sited, see
# configs/ladybug.yaml.
name: Lowland Root
gen: rootreach
params:
  under: out/island_full.litematic
  at: [-24200, 30018]
  grip: [-24200, 30018]        # the keel itself: solid cobble at Y142, air below
  y_top: 141                   # first air course under the keel
  y_tip: 95                    # the root gives out mid-air, inside the stair's deepslate band
                               # (Y78-114): the island's reach ends where the underworld's
                               # blackstone begins. Jack's call - the full-height root read wrong.
  taper: 14
  strands: 3
  seed: 0
origin_lock: false             # LOUD: spans Y38-149 in the open void under the islet
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
  # Shop Islet is NOT deferred to: its underside fill claims the very cell the root hangs
  # from (-24200,141,30018), and deferring it left the whole braid with nothing to place
  # against. The root wins its anchor; the islet design is carved around it (see its config).
  defer_to: [out/Lowland Ruinway.litematic, out/Lowland Turtle.litematic]
  context_clear: [vine]
  verify_against: out/island_full.litematic
