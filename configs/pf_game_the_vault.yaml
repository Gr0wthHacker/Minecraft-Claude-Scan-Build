# PF GAME THE VAULT - fitted into PF Resonance Vault.
#
# A CONSOLE, NOT A BOOTH: the machine sits in a cabinet on the room's own floor and writes
# only into air, so it shares no cell with the building it stands in. `refused` in the
# sidecar is the count of cells the capture would not give up - it must be zero, or the
# machine is missing a piece and does nothing.
name: PF Game The Vault
gen: park_games
params:
  kind: pattern
  land: prismworks
  facing: west
  at: [97586, 204, 80782]
  building: PF Resonance Vault
  # **A CONSOLE'S CONTEXT IS THE GROUND LAYER, NOT THE COMPOSITE IT ENDS UP IN.** Pointed at
  # `Park Complete` this design reads a world that ALREADY CONTAINS ITSELF the moment it is placed:
  # `park_games` refuses every cell the capture owns, so a regenerate finds its own standing copy
  # and ships a stub of a machine, silently, with 0 problems. `PF Game The Riffle` lost its disc,
  # its comparator and its whole lamp row that way and still audited clean.
  under:
    - out/Park Ways.litematic
    - out/PF Park Green.litematic
  pattern: [True, False, True]
  door: True
  title: 'THE VAULT'
roles: [ride]
design:
  purpose: ride
  hierarchy: supporting
  style: prismworks
  narrative: >
    Three resonance levers and an iron door. One of the eight settings opens it and the other seven do nothing at all.
finish:
  cheapen: false
  hollow: false
  ground: false
  drop_floaters: false
origin_lock: false
expensive_allowance: 2
expensive_reason: >
  2x redstone_lamp - a light cannot be substituted by colour (the nearest cheap match is a lamp that does not light), and the lamp IS the score this game shows, so the cost is declared rather than hidden
